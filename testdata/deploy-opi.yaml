# 示例多机部署配置：嵌入式 Linux 执行节点（Micro 资源类）
# 按实际环境复制并调整：安装路径、用户、peer 地址
node:
  name: "node-arm64-0"
  resource_class: "Micro"

network:
  listen_addr: ":7836"
  # 所有节点必须共享同一个 shared_secret（经 OPENPANDA_SHARED_SECRET 环境变量注入，不要写入此文件）
  shared_secret: ""
  peers:
    - "scheduler.example.internal:7836"   # 入口/调度节点
    - "worker.example.internal:7836"      # 另一个执行节点

storage:
  db_path: "/opt/openpanda/data/openpanda.db"
  context_path: "/opt/openpanda/data/context"
  memory_path: "/opt/openpanda/memory"
  projects_path: "/opt/openpanda/projects"
  skills_path: "/opt/openpanda/skills"
  work_path: "/opt/openpanda"

log:
  level: "info"
