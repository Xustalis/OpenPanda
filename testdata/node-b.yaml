# 本地 loopback/集成测试双节点示例配置 —— 节点 B（远端对端）
# 与 node-a.yaml 配对使用；共享同一个 shared_secret（环境变量注入）。
node:
  name: "test-node-b"
  resource_class: "Micro"
  kind: "vm"
  identity: "local-test-node-b"

network:
  listen_addr: "127.0.0.1:17936"
  shared_secret: ""               # 经环境变量注入；禁止写入此文件
  panel:
    addr: "127.0.0.1:17937"
    token: ""                     # 经 OPENPANDA_PANEL_TOKEN 注入
  peers:
    - "127.0.0.1:17836"          # 对应 node-a 的 listen_addr

storage:
  db_path: "testdata/node-b.db"
  context_path: "testdata/node-b/context"
  memory_path: "testdata/node-b/memory"
  projects_path: "testdata/node-b/projects"
  skills_path: "testdata/node-b/skills"
  work_path: "testdata/node-b"

log:
  level: "debug"
  format: "json"
