# 本地 loopback/集成测试双节点示例配置 —— 节点 B（远端对端）
# 与 node-a.yaml 配对使用；共享同一个 shared_secret（环境变量注入）。
node:
  name: "test-node-b"
  resource_class: "Micro"
  kind: "vm"
  identity: "local-test-node-b"

network:
  listen_addr: "127.0.0.1:17936"
  shared_secret: ""               # 经环境变量注入；禁止写入此文件
  # Panel keys are flat — network.panel_addr / network.panel_token. The older
  # nested "panel: {addr, token}" form is not read, and was being ignored here.
  panel_addr: "127.0.0.1:17937"
  panel_token: ""                 # 经 OPENPANDA_PANEL_TOKEN 注入
  peers:
    - "127.0.0.1:17836"          # 对应 node-a 的 listen_addr

# 相对路径相对本文件所在目录（testdata/）解析，不是启动时的 cwd。
storage:
  db_path: "node-b.db"
  context_path: "node-b/context"
  memory_path: "node-b/memory"
  projects_path: "node-b/projects"
  skills_path: "node-b/skills"
  work_path: "node-b"

log:
  # The logger always emits structured JSON; there is no log.format key.
  level: "debug"
