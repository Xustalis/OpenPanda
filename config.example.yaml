# OpenPanda node configuration
# Copy to /etc/openpanda/config.yaml on each node, or run with --config.
node:
  name: "macbook-m1"
  resource_class: "Standard"  # Micro | Standard | Full
  kind: "physical"             # physical | vm; one physical node per host
  # VM deployments must set a stable identity distinct from the host.
  # identity: "vm-macbook-dev"

network:
  listen_addr: ":7836"           # WebSocket listener (kernel daemon)
  # ── Transport security: plain ws:// is NOT encrypted ──
  # Only use plain WebSocket over loopback, Tailscale/VPN, or a trusted LAN.
  # If any peer crosses the public Internet, terminate TLS in a reverse proxy
  # and set peers to "wss://host:port".
  # ── Transport auth: the WS listener REFUSES to start without a shared secret ──
  # The HMAC secret authenticates node-to-node hellos; every node in the P2P
  # network must share the same value. Prefer env OPENPANDA_SHARED_SECRET.
  # NOTE: shared_secret authenticates peers but does NOT encrypt payloads.
  shared_secret: ""              # e.g. openssl rand -hex 32; keep out of public repos
  # ── Connection limits (slow-DoS protection) ──
  # max_connections: 64            # global concurrent WS connections (0 = unlimited)
  # max_connections_per_ip: 8      # per-remote-IP concurrent WS connections (0 = unlimited)
  # ── Embedded console / panel address ──
  # Reused by the webui sidecar (webui/cmd/panel), `panda web`, and the REPL
  # `/web` command. Empty falls back to 127.0.0.1:7840; a non-loopback bind
  # without panel_token refuses to start. Plain HTTP — keep loopback or put
  # it behind a TLS reverse proxy.
  panel_addr: "127.0.0.1:7840"
  # panel_token: ""              # Bearer token guarding /api/* (prefer env OPENPANDA_PANEL_TOKEN)
  peers:                         # manual peers
    # - "worker-1.your-tailnet.ts.net:7836"

storage:
  db_path: "./data/openpanda.db"
  context_path: "./data/context"
  memory_path: "./memory"        # Hermes personal memory root (Phase 3)
  projects_path: "./projects"    # per-project memory root (Phase 3)
  skills_path: "./skills"        # procedural-memory root (Phase 3)
  work_path: "."                 # agents execute here; scope drift measured here
  # Packed task-artifact pool: artifacts shipped across nodes are stored here,
  # named by hash. Not ctxstore (the Micro-node LRU keeps only 5 entries and
  # would silently evict them), not SQLite (artifacts are gigabyte-scale).
  # artifact_path: "artifacts"

log:
  level: "info"                  # debug | info | warn | error

# LLM provider for the entry model and agent adapters. Supports both OpenAI-compatible
# and Anthropic-compatible endpoints.
#
# Examples:
#   1. DeepSeek (Anthropic endpoint, recommended default):
#      base_url: "https://api.deepseek.com/anthropic"
#      model: "deepseek-v4-flash"
#      api_type: "anthropic"
#
#   2. Official OpenAI:
#      base_url: "https://api.openai.com/v1"
#      model: "gpt-4o"  # or "o3-mini", "o1", "gpt-4o-mini"
#      api_type: "openai"
#
#   3. DeepSeek (OpenAI-compatible endpoint):
#      base_url: "https://api.deepseek.com"
#      model: "deepseek-v4-flash"  # or "deepseek-v4-pro" (costlier; never a default)
#      api_type: "openai"
#
#   4. Alibaba Cloud DashScope / Tongyi Qwen (通义千问):
#      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
#      model: "qwen-plus"  # or "qwen-max", "qwq-32b", "qwen2.5-coder-32b-instruct"
#      api_type: "openai"
#
#   5. SiliconFlow (硅基流动):
#      base_url: "https://api.siliconflow.cn/v1"
#      model: "deepseek-ai/DeepSeek-V3"  # or "deepseek-ai/DeepSeek-R1"
#      api_type: "openai"
#
#   6. Moonshot Kimi (月之暗面):
#      base_url: "https://api.moonshot.cn/v1"
#      model: "moonshot-v1-auto"  # or "kimi-k1.5-preview"
#      api_type: "openai"
#
#   7. Zhipu AI GLM (智谱清言):
#      base_url: "https://open.bigmodel.cn/api/paas/v4"
#      model: "glm-4-plus"  # or "glm-4-flash"
#      api_type: "openai"
#
#   8. Ollama Local:
#      base_url: "http://localhost:11434/v1"
#      model: "deepseek-r1:14b"  # or "qwen2.5-coder:14b", "llama3.3"
#      api_type: "openai"
#
#   9. OpenRouter:
#      base_url: "https://openrouter.ai/api/v1"
#      model: "anthropic/claude-3.5-sonnet"
#      api_type: "openai"
#
model:
  base_url: "https://api.deepseek.com/anthropic"
  model: "deepseek-v4-flash"
  api_type: "anthropic"         # anthropic | openai (default anthropic)
  # max_tokens: 4096            # completion cap; default 4096
  # api_key: ""                 # secret; prefer env OPENPANDA_MODEL_API_KEY

# MCP server (Model Context Protocol): one stdio server whose tools become
# callable by the ask engine. The command is space-separated argv; empty
# disables MCP. Live reload applies only where the engine is held reloadable —
# `panda web` and the REPL pick up changes without a restart; the headless
# daemon builds its engine once at startup and needs a restart to see edits.
# mcp:
#   command: "npx -y @modelcontextprotocol/server-filesystem /tmp"

# Model injection into agent subprocesses. Default: agent-native models win.
#   auto    inject panda's model endpoint only when the agent carries no model
#           credentials of its own (env ANTHROPIC_API_KEY/OPENAI_API_KEY,
#           login state, or its config files) and panda has a model configured
#   always  always override the agent with panda's model endpoint (legacy)
#   never   never inject; agents always use their own models
# Every injection is announced at the top of the task output and recorded in
# the audit log and the task event stream.
injection:
  model: "auto"                # auto | always | never

# Local agent routing tuning. Routing scores each matching agent as
# capability match × cost-tier discount, then picks the highest score;
# agents listed here get a +0.5 bonus. If the chosen agent's CLI is missing
# at execution time, the next-best matching agent is tried (fallback chain).
# routing:
#   preferred_agents: []       # e.g. ["codex", "opencode"]

# Memory system tunables. Character caps for each memory file class; files
# over the cap are refused on write.
# memory:
#   limits:
#     user: 5000               # USER.md (user profile)
#     memory: 10000            # MEMORY.md (environment notes)
#     project: 30000           # per-project MEMORY.md

# Task approval gate.
#   always      every task needs explicit approval before execution
#   on-request  only tasks the entry model flags as risky need approval
#   never       tasks run as classified
# approval:
#   mode: "on-request"         # always | on-request | never

# Time budget for long tasks (seconds; omit or delete to use built-in
# defaults). Deep-learning-style tasks can run for hours, while the defaults
# are tuned for "patch a snippet of code" — so these knobs must be tunable.
# timeouts:
#   # How long one task attempt may hold its lease; after expiry the supervisor
#   # treats the executor as dead and re-routes. Heartbeats renew at lease/3
#   # during execution, so this bounds "how long an executor may go silent",
#   # not total task time. Default 1200. Must stay well above agent_s: if the
#   # lease expires while the adapter is still running fine, the task is force-
#   # failed and re-dispatched, so the same work runs twice on two machines.
#   task_lease_s: 1200
#   # Wall-clock budget for one agent-adapter execution (told to the adapter and
#   # enforced as a hard deadline). Default 600.
#   agent_s: 600
#   # Cap on the execute → judge → re-dispatch loop per task. Default 5.
#   supervise_rounds: 5

# Web Push notifications (design P3-26): task entering review → phone push.
# Read by the embedded console (`panda web`); requires a secure context —
# HTTPS, or loopback which browsers already treat as secure.
# VAPID key is auto-generated and persisted at vapid_key_path on first boot
# (keep it stable).
push:
  enabled: false                  # true to serve /api/push/* and send pushes
  vapid_subject: "mailto:panda@localhost"
  vapid_key_path: "./data/vapid.pem"

# Front-end preferences. `locale` is the language /lang last switched to in
# the REPL/TUI; empty (or omitted) follows the terminal's LANG/OPENPANDA_LANG.
# OPENPANDA_LANG still wins over this setting when set.
# ui:
#   locale: "zh-CN"               # en | zh-CN | ja | es | de
