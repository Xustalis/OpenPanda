# PANDA node configuration
# Copy to /etc/panda/config.yaml on each node, or run with --config.
node:
  name: "macbook-m1"
  resource_class: "Standard"  # Micro | Standard | Full

network:
  listen_addr: ":7836"           # WebSocket listener
  panel_addr: ":7840"            # HTTP PWA control panel (empty = disabled)
  peers:                         # manual peers
    - "orangepi3b.tailnet-name.ts.net:7836"

storage:
  db_path: "./data/panda.db"
  context_path: "./data/context"
  memory_path: "./memory"        # Hermes personal memory root (Phase 3)
  projects_path: "./projects"    # per-project memory root (Phase 3)
  skills_path: "./skills"        # procedural-memory root (Phase 3)
  work_path: "."                 # agents execute here; scope drift measured here

log:
  level: "info"                  # debug | info | warn | error

# LLM provider for the entry model and agent adapters. DeepSeek exposes an
# Anthropic-compatible Messages API; any /v1/messages-compatible endpoint works.
model:
  base_url: "https://api.deepseek.com/anthropic"
  model: "deepseek-chat"          # deepseek-chat | deepseek-reasoner
  # api_key: ""                   # secret; prefer env PANDA_MODEL_API_KEY
