# OpenPanda node configuration
# Copy to /etc/openpanda/config.yaml on each node, or run with --config.
# Easier: `panda init` generates a per-machine config (unique node name from
# the hostname, fresh shared secret) — prefer it over copying this file.
node:
  # REQUIRED: a name unique per machine — it is how peers and the queue refer
  # to this node. `panda init` derives one from the hostname automatically.
  name: "change-me"
  resource_class: "Standard"  # Micro | Standard | Full
  kind: "physical"             # physical | vm; one physical node per host
  # VM deployments must set a stable identity distinct from the host.
  # identity: "vm-dev-01"

network:
  # Wildcard by default: since this release every frame after the hello
  # handshake is AEAD-sealed (capability "sessaead", keyed by the shared
  # secret + both hello nonces), so an any-interface bind exposes nothing
  # readable to the LAN — the two signed hellos carry no secret material.
  # Narrow it to a specific interface (e.g. "192.168.1.10:7836") if you want
  # the socket itself unreachable, not just unreadable.
  listen_addr: "0.0.0.0:7836"  # WebSocket listener (kernel daemon)
  # ── Transport security: sessaead seals the wire; ws:// is safe everywhere ──
  # Peers too old to negotiate sessaead fall back to plaintext, which the
  # cleartext policy still gates: loopback, Tailscale hosts, and
  # allow_cleartext_for entries pass; everything else is refused. For wss://
  # peers terminate TLS in a reverse proxy (the listener does no TLS itself).
  # ── Transport auth: the WS listener REFUSES to start without a shared secret ──
  # The HMAC secret authenticates node-to-node hellos; every node in the P2P
  # network must share the same value. Prefer env OPENPANDA_SHARED_SECRET.
  # It also keys the per-connection AEAD session cipher (HKDF over the secret
  # plus both hello nonces), so it is the root of both authentication and
  # confidentiality — treat it like a password, not a checksum.
  # `panda init` generates one automatically; `panda pair`/`nodes invite` fill
  # it when missing; a daemon with none generates and persists one at boot.
  shared_secret: ""              # e.g. openssl rand -hex 32; keep out of public repos
  # ── Connection limits (slow-DoS protection) ──
  # max_connections: 64            # global concurrent WS connections (0 = unlimited)
  # max_connections_per_ip: 8      # per-remote-IP concurrent WS connections (0 = unlimited)
  # ── Embedded console / panel address ──
  # Reused by the webui sidecar (webui/cmd/panel), `panda web`, and the REPL
  # `/web` command. Empty falls back to 127.0.0.1:7840. A non-loopback bind
  # without panel_token gets an ephemeral token for the session (the API
  # never runs open) and a loud warning — but plain HTTP means the token and
  # task contents are sniffable on the path, so prefer loopback or a TLS
  # reverse proxy, and set a stable token for anything long-lived.
  panel_addr: "127.0.0.1:7840"
  # panel_token: ""              # Bearer token guarding /api/* (prefer env OPENPANDA_PANEL_TOKEN)
  # ── UDP datagram plane (Periapsis): NAT traversal + AEAD-sealed delivery ──
  # The UDP socket carries sealed envelopes between nodes that cannot hold a
  # WebSocket open — e.g. both sides behind NAT. Every datagram is sealed with
  # AES-256-GCM keyed from shared_secret, so a wildcard bind is safe.
  #   ""   (default/omitted) — bind UDP on the same port as listen_addr
  #   "off"                  — disable the datagram plane entirely
  #   ":7837" / "0.0.0.0:7837" — explicit address
  # udp_listen: ""
  # STUN servers used to discover the public reflexive address for hole
  # punching. Empty (default) relies on peer-observed addresses from the WS
  # hello, which is enough for most home/office NATs; add a server only if
  # you run your own or trust a public one (they learn your IP, nothing else).
  # stun_servers:
  #   - "stun.l.google.com:19302"
  # ── LAN auto-discovery ──
  # A small UDP beacon ("panda-beacon/1") announces this node on the LAN so
  # `panda nodes` on another host can show it under "not paired" and
  # `panda nodes admit <id>` can peer it. The beacon carries only
  # id/address/version/pubkey — never credentials — and is Ed25519-signed so
  # a listed ✓ fingerprint provably belongs to its broadcaster (⚠ marks the
  # unsigned legacy form). Joining still requires the shared secret and a
  # signed Ed25519 hello — a beacon admits nothing.
  #   ""      (default) — broadcast+listen on :7837
  #   "off"             — disable discovery entirely
  # discovery_addr: ":7837"
  # discovery_auto_dial (default true): turn a discovered node into a dial
  # without `nodes admit`. Only beacons whose resolved host IS the packet's
  # own source IP are dialed — a forged beacon can name any address, but it
  # cannot move its packet's origin, so this can never be aimed at a third
  # party. The hello's shared secret still decides membership; auto-dial only
  # saves typing the IP. Set false to keep every join an explicit admit.
  # discovery_auto_dial: false
  # ── Cross-network mesh (discovery / rendezvous / blind relay) ───────────
  # Nodes behind NAT discover and reach each other without any fixed
  # centre: the directory is gossiped along every edge, rendezvous is a
  # capability a node advertises rather than a role it holds, and a relay
  # sees only "for k:<pub>, TTL, N bytes" because the payload is sealed
  # end-to-end. Path order is strictly direct-first — configured peer, then
  # advertised addr, then hole punch, then relay, then the DTN outbox.
  # bootstrap_edges (default 2): rendezvous edges this node keeps. Two
  # survive one loss without a partition. 0 is manual mode — no edges are
  # elected and the mesh is exactly the peers listed above, the behaviour
  # every release before this feature had.
  # bootstrap_edges: 2
  # auto_punch (default true): when a send finds no live track, punch a
  # directory peer that advertises a UDP port instead of waiting for a
  # hand-written `punch:<id>` entry. Two failed windows mark the peer
  # nat_suspect for 10 minutes (persisted across restarts) — after that the
  # honest path is the relay, then the outbox, not endless spraying.
  # auto_punch: true
  # transit (default true): this node's CLIENT half of the relay plane —
  # whether it hands frames to a relay hop when it has no live track.
  # Serving other members is the separate trust.relay surface below, so a
  # small box can consume relays without ever paying to serve one.
  # transit: true
  # rendezvous (default "auto"): this node's own willingness to be a
  # rendezvous point. "auto" advertises the role only once this node can
  # prove it is reachable — today a globally routable listen address or a
  # hostname (the AutoNAT callback proof tightens this further); "always"
  # is an operator assertion behind a NAT map we cannot see from here;
  # "never" keeps the role off the card. Reading OTHER nodes' rendezvous
  # rows is unaffected — a node that never serves still uses everyone
  # else's edges.
  # rendezvous: "auto"

  # ── Cleartext ws:// gate (legacy peers only) ──
  # Modern peers negotiate sessaead inside the hello and seal every frame
  # after it, so ws:// to them is safe anywhere. The gate below only governs
  # links that DID NOT negotiate encryption — peers too old to speak
  # sessaead, where a network MITM could still forge a task_delegate.
  # Plaintext links are refused unless the remote is loopback or Tailscale
  # (100.64.0.0/10, fd7a:115e:a214::/48, *.ts.net) — anything else needs the
  # peer upgraded (preferred), wss:// (terminate TLS in front; the listener
  # does not speak TLS), a punch:<id> peer (AEAD datagrams), or an explicit
  # opt-in:
  #   allow_cleartext_for: ["192.168.0.0/16"]  # scoped: just these CIDRs/IPs/hosts
  #   allow_cleartext: true                    # global: trusted networks only —
  #                                            # plaintext toward EVERY peer
  # Prefer allow_cleartext_for on a LAN: it opens your segment without
  # disarming the MITM check for peers everywhere else.
  peers:                         # manual peers
    # - "worker-1.your-tailnet.ts.net:7836"
    # - "punch:laptop-home"      # node behind NAT — coordinate UDP hole
    #                            # punching through the mesh; needs no
    #                            # reachable listen_addr on either side

  # ── Trust zones (experimental) ─────────────────────────────────────────
  # Every peer defaults to "mesh" — the pre-feature full-trust behaviour.
  # A peer entry may carry a tier instead of the bare scalar:
  #   peers:
  #     - addr: "vps.example.com:7836"
  #       trust: "guarded"         # mesh | guarded | open
  # guarded clamps what delegates toward it may carry (context capped at a
  # pull-pointer, project packs / artifact inputs / consent grants stripped)
  # and admits work it originates under the accept policy below; open never
  # receives a delegate and its pushes are refused until the offer/bid
  # market exists. `panda nodes trust <id> <level>` pins a tier on a known
  # node (`k:<pubkey>` pins the stable identity across id churn); a peer
  # key change demotes an asserted mesh back to guarded. Other entry
  # points: `panda nodes add/admit --trust`, `panda pair --trust`,
  # `/nodes ...` in the REPL, and the trust selector on the console's
  # nodes page. An addr-level hint binds once this node's OWN dial hello
  # records the address→identity mapping — a configured peer that only
  # ever dials IN never binds its hint, so pin such rows via `nodes trust`.
  # trust:
  #   send:
  #     guarded:                 # outbound ceiling toward guarded peers
  #       context_level: "pointer"   # full | pointer | summary
  #                                # pointer = executor pulls the snapshot via
  #                                # context_fetch — authenticated, authorized,
  #                                # logged, but the FULL bytes still move on
  #                                # request. It is an audit point, not a
  #                                # secrecy bound; for that use "summary",
  #                                # which strips the reference so no pull is
  #                                # possible (fetch is refused under a
  #                                # summary ceiling even if a hash leaks).
  #       project_pack: false        # ship project memory inline
  #       inputs: false              # ship artifact/worktree references
  #       consent: false             # let tier-2 grants ride the delegate
  #       screen: false              # run screen-capture tasks — the output
  #                                # IS this desktop's pixels, so the default
  #                                # denies: display content crosses mesh
  #                                # links only. Set true for the same-owner
  #                                # case (your own VPS on a rough segment).
  #   accept:
  #     guarded:                 # inbound admission for guarded-origin work
  #       mode: "auto"             # auto | review | refuse
  #       policy_llm: "off"        # off | shadow | enforce — optional
  #                                # zero-tool classifier; safety stays
  #                                # deterministic whatever it says
  #       foreign_consent: "strip" # strip | honor — whether a NON-mesh
  #                                # origin's tier-2 consent may substitute
  #                                # for THIS node's approval. strip
  #                                # (default) drops it: the task runs on
  #                                # the restricted tool face and its
  #                                # irreversibles land in the local review
  #                                # queue — their yes is not our yes.
  #                                # honor for the same-owner case (your
  #                                # own VPS on an untrusted segment).
  #       model_creds: "withhold"  # withhold | provide — whether a task
  #                                # admitted from a non-mesh path may
  #                                # receive THIS node's model credentials
  #                                # in the agent subprocess env. withhold
  #                                # (default) also blocks the credential
  #                                # passthrough and auth-failure fallback
  #                                # paths, so a guarded peer's `env` read
  #                                # finds nothing. provide for the
  #                                # same-owner case only — a guarded peer
  #                                # you nevertheless trust with keys.
  #       self_signed: "strip"     # honor | strip | refuse — how work whose
  #                                # ORIGIN runs a self-evolution-built
  #                                # binary is treated. strip (default)
  #                                # drops its tier-2 consent grant like
  #                                # foreign_consent does: the task lands on
  #                                # the restricted tool face and
  #                                # irreversibles park for local review.
  #                                # refuse declines the delegate outright;
  #                                # honor weighs its consent like a
  #                                # release-signed build's. Provenance is
  #                                # self-asserted — this is a conservative
  #                                # dial on honest nodes, not an
  #                                # attestation check.

  #   relay:                     # blind-relay permission tables
  #     transit:                 # whose relayed frames this node forwards ON
  #       mesh: true             # a trusted member's frame is baseline
  #       guarded: true          # mesh citizenship
  #       open: false            # a stranger's frame never spends our uplink
  #     serve:                   # whose relay hops we route OUR frames through
  #       mesh: true
  #       guarded: false         # a semi-trusted box sees only sealed bytes,
  #       open: false            # so rows are labelled by the OTHER end's tier
  #     max_kbps: 0              # 0 = unlimited; a token bucket on relayed
  #                              # bytes — self-harm protection on a metered
  #                              # link, not a fairness scheduler. Excess is
  #                              # dropped (transit is best-effort; the
  #                              # sender's outbox is the reliable path).
  #     max_sessions: 64         # concurrent relayed frames, 0 = unlimited

  # ── DTN contact plan: scheduled transmission windows ─────────────────────
  # For links that are predictably up only at times — a nightly batch host, a
  # radio pass, a laptop that wakes on a schedule. Each window is advertised
  # in heartbeats so the whole mesh routes custody by the schedule: a bundle
  # parks on intermediate nodes until the window opens instead of failing
  # against an offline peer. start/end take RFC3339 or unix seconds; period
  # repeats the window ("24h" or 86400); rate_bps lets the router refuse a
  # bundle whose transfer cannot finish inside the window (0 = unknown).
  # contacts:
  #   - peer: "ground-station-1"           # node id, not an address
  #     start: "2026-10-01T02:00:00Z"
  #     end:   "2026-10-01T02:10:00Z"
  #     period: "24h"                      # daily ten-minute pass
  #     rate_bps: 8000000

storage:
  db_path: "./data/openpanda.db"
  context_path: "./data/context"
  memory_path: "./memory"        # Hermes personal memory root (Phase 3)
  projects_path: "./projects"    # per-project memory root (Phase 3)
  skills_path: "./skills"        # procedural-memory root (Phase 3)
  work_path: "."                 # agents execute here; scope drift measured here
                                 # Runtime scratch (task/plan dirs, landed remote
                                 # project copies) lives in .openpanda under this
                                 # root — one hidden dir, never three visible
                                 # ones. Only the default node data dir keeps
                                 # them at top level, beside the database.
  # Packed task-artifact pool: artifacts shipped across nodes are stored here,
  # named by hash. Not ctxstore (the Micro-node LRU keeps only 5 entries and
  # would silently evict them), not SQLite (artifacts are gigabyte-scale).
  # artifact_path: "artifacts"
  # Days a settled task (done/failed/cancelled/expired) is kept before the
  # hourly sweep deletes it — the task table otherwise only grows, and every
  # task listing pays for the archive. Default 30; explicit 0 keeps forever.
  # review tasks never age out: a row parked for a human is not history.
  # task_retention_days: 30

log:
  level: "info"                  # debug | info | warn | error

# LLM provider for the entry model and agent adapters. Supports both OpenAI-compatible
# and Anthropic-compatible endpoints.
#
# Examples:
#   1. DeepSeek (Anthropic endpoint, recommended default):
#      base_url: "https://api.deepseek.com/anthropic"
#      model: "deepseek-flash"
#      api_type: "anthropic"
#
#   2. Official OpenAI:
#      base_url: "https://api.openai.com/v1"
#      model: "gpt-6.1-sol"  # or "gpt-6-astra", "gpt-6-luna", "gpt-5.4"
#      api_type: "openai"
#
#   3. DeepSeek (OpenAI-compatible endpoint):
#      base_url: "https://api.deepseek.com"
#      model: "deepseek-flash"  # or "deepseek-v4-pro" (costlier; never a default)
#      api_type: "openai"
#
#   4. Alibaba Cloud DashScope / Tongyi Qwen (通义千问):
#      base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
#      model: "qwen3.7-plus"  # or "qwen3.8-max", "qwen3.8-flash", "qwen3-coder-plus"
#      api_type: "openai"
#
#   5. SiliconFlow (硅基流动):
#      base_url: "https://api.siliconflow.cn/v1"
#      model: "deepseek-ai/DeepSeek-V4.1-Flash"  # or "deepseek-ai/DeepSeek-V4-Pro"
#      api_type: "openai"
#
#   6. Moonshot Kimi (月之暗面):
#      base_url: "https://api.moonshot.cn/v1"
#      model: "kimi-k3"  # or "kimi-k2.7-code"
#      api_type: "openai"
#
#   7. Zhipu AI GLM (智谱清言):
#      base_url: "https://open.bigmodel.cn/api/paas/v4"
#      model: "glm-5.3"  # or "glm-5.3-flash", "glm-4.7"
#      api_type: "openai"
#
#   8. Ollama Local:
#      base_url: "http://localhost:11434/v1"
#      model: "qwen3:8b"  # or "deepseek-r1:14b", "gpt-oss:20b"
#      api_type: "openai"
#
#   9. OpenRouter:
#      base_url: "https://openrouter.ai/api/v1"
#      model: "anthropic/claude-sonnet-5.5"
#      api_type: "openai"
#
# The model section is commented out on purpose: there is no built-in default
# vendor — a copied file must not silently adopt one. Configure a model with
# `panda init`, the first-run wizard, `panda model add`, or by uncommenting and
# editing the block below (DeepSeek shown as example 1 above).
#
# model:
#   provider: "deepseek"        # built-in provider id — its endpoint, dialect
#                               # and per-vendor tuning are merged in, so
#                               # base_url/api_type may be omitted
#   model: "deepseek-flash"
#   api_key: ""                 # secret; prefer env OPENPANDA_MODEL_API_KEY
#   api_type: "anthropic"       # anthropic | openai (default anthropic)
#   max_tokens: 4096            # completion cap (output, not context size);
#                               # default 4096. A value above the provider's
#                               # hard ceiling is clamped to it, not failed.
#   offline_wait: true          # default true. When this endpoint needs the
#                               # internet and the machine loses it, the call
#                               # waits — probing the link every few seconds —
#                               # and replays the moment it is back, instead of
#                               # burning its retry budget on a dead route.
#                               # false restores fail-fast; endpoints on
#                               # loopback/LAN (a local model) are exempt.
#   max_retries: 5              # transport retries on 429/5xx, past the first
#                               # attempt. Negative disables them.

# Multi-model registry: named models the REPL switches between with /model.
# Each entry is a full model config; name is the alias `/model <name>` uses.
# Add one in the REPL with `/model add <provider> <key>` — it fills endpoint,
# dialect and tuning from the built-in catalogue, so you only supply the key.
#
# Built-in providers (internal/providers): deepseek, claude (Anthropic),
# openai (ChatGPT), kimi (月之暗面), minimax, volcengine (火山引擎/豆包),
# zhipu (智谱), qwen (通义千问), siliconflow (硅基流动), openrouter,
# ollama (本地), custom.
#
# models:
#   - name: deepseek
#     provider: deepseek
#     base_url: "https://api.deepseek.com/anthropic"
#     model: "deepseek-flash"
#     api_type: "anthropic"
#     api_key: ""               # your key here
#   - name: claude
#     provider: claude
#     base_url: "https://api.anthropic.com"
#     model: "claude-sonnet-5-5"
#     api_type: "anthropic"
#     api_key: ""
#   - name: kimi
#     provider: kimi
#     base_url: "https://api.moonshot.cn/v1"
#     model: "kimi-k3"
#     api_type: "openai"
#     api_key: ""

# MCP server (Model Context Protocol): one stdio server whose tools become
# callable by the ask engine. The command is space-separated argv; empty
# disables MCP. Live reload applies only where the engine is held reloadable —
# `panda web` and the REPL pick up changes without a restart; the headless
# daemon builds its engine once at startup and needs a restart to see edits.
# mcp:
#   command: "npx -y @modelcontextprotocol/server-filesystem /tmp"

# Model injection into agent subprocesses. Default: agent-native models win.
#   auto    inject panda's model endpoint only when the agent carries no model
#           credentials of its own (env ANTHROPIC_API_KEY/OPENAI_API_KEY,
#           login state, or its config files) and panda has a model configured
#   always  always override the agent with panda's model endpoint (legacy)
#   never   never inject; agents always use their own models
# Every injection is announced at the top of the task output and recorded in
# the audit log and the task event stream.
#
# `agents` pins a model used ONLY for injection into that agent. One node model
# cannot satisfy every dialect: a harness speaking Anthropic Messages rejects an
# OpenAI-style endpoint and vice versa, so switching the node model to please one
# agent silently removes the failure-time injection rescue for the others. Unset
# fields inherit the node model — api_key and model included — so the common
# case is just the two lines that change the dialect:
#   agents:
#     deepseek_harness:                        # agent name, or "foo.py"
#       api_type: anthropic
#       base_url: https://open.bigmodel.cn/api/anthropic
injection:
  model: "auto"                # auto | always | never

# Local agent routing tuning. Routing scores each matching agent as
# capability match × cost-tier discount, then picks the highest score;
# agents listed here get a +0.5 bonus. If the chosen agent's CLI is missing
# at execution time, the next-best matching agent is tried (fallback chain).
# routing:
#   preferred_agents: []       # e.g. ["codex", "opencode"]
#   reputation: false          # experimental (trust zones): fold each
#                              # executor's locally observed delegation
#                              # success rate into routing scores. Local
#                              # metrics only — never peer-reported.

# Sub-agent delegation limits. A parent agent may decompose its work into
# child tasks that run in parallel and report back through the shared message
# board; these knobs bound how wide and how deep that fan-out may grow.
#
# Same-node parallelism inside ONE project, two modes, both declared by the
# delegating agent (no config knob):
#   paths   — the child names the project-relative directories it owns and
#             locks only those scopes: disjoint siblings run SIMULTANEOUSLY
#             in the shared worktree; overlapping or undeclared claims
#             serialize on the project lock exactly as before.
#   isolate — the child gets a private copy of the project tree (a git
#             worktree when the project is a repository, populated from HEAD
#             plus the working tree's uncommitted changes): it locks nothing
#             shared, runs fully parallel with everything, and its changes
#             merge back into the project tree when it finishes. The merge
#             is a three-way (fork baseline / project tree / child tree) —
#             paths only the child touched apply cleanly, paths both sides
#             changed are reported as conflicts and keep the project's
#             bytes, and the workspace is kept for inspection on conflict.
# delegation:
#   enabled: true              # false forbids agent-driven sub-agent spawning
#                              # on this node outright (delegate markers get a
#                              # refusal, not a child task)
#   max_children: 8            # total child tasks one task may spawn over all
#                              # of its rounds (per task, not per node)
#   fanout: 4                  # child spawns awaited concurrently per parent;
#                              # node-wide parallelism is still bounded by
#                              # card.capacity.max_concurrent
#   max_depth: 3               # deepest spawn generation: root task = depth 0,
#                              # children = 1, grandchildren = 2, ... A task at
#                              # max_depth is not offered the delegation
#                              # protocol and cannot spawn further children.
#
# Memory system tunables. Character caps for each memory file class; files
# over the cap are refused on write.
# memory:
#   limits:
#     user: 5000               # USER.md (user profile)
#     memory: 10000            # MEMORY.md (environment notes)
#     project: 30000           # per-project MEMORY.md

# Task approval gate.
#   always      every task needs explicit approval before execution
#   on-request  only tasks the entry model flags as risky need approval
#   never       tasks run as classified
# approval:
#   mode: "on-request"         # always | on-request | never

# Time budget for long tasks (seconds; omit or delete to use built-in
# defaults). Deep-learning-style tasks can run for hours, while the defaults
# are tuned for "patch a snippet of code" — so these knobs must be tunable.
# timeouts:
#   # How long one task attempt may hold its lease; after expiry the supervisor
#   # treats the executor as dead and re-routes. Heartbeats renew at lease/3
#   # during execution, so this bounds "how long an executor may go silent",
#   # not total task time. Default 1200. Must stay well above agent_s: if the
#   # lease expires while the adapter is still running fine, the task is force-
#   # failed and re-dispatched, so the same work runs twice on two machines.
#   task_lease_s: 1200
#   # Wall-clock budget for one agent-adapter execution (told to the adapter and
#   # enforced as a hard deadline). Default 600.
#   agent_s: 600
#   # How long one agent execution may produce ZERO progress notes or output
#   # before the watchdog calls it stalled and aborts the attempt. A wedged
#   # provider call or dead CLI emits nothing for arbitrarily long — four
#   # silent minutes is a corpse, not a slow worker, and killing it lets the
#   # retry succeed instead of burning the whole agent budget. Default 240;
#   # set -1 to disable the kill (the "no output for Xs" heartbeat notes still
#   # post, the stall just is not aborted).
#   silence_s: 240
#   # Wall-clock budget for one native-ability command (card native exec).
#   # Native work is not always short — a build, a benchmark, a data reduction
#   # can legitimately run past the built-in 5-minute default, and until this
#   # knob existed such a task was killed at 5m with "command timed out" and
#   # no way to extend it. Unset keeps the 5-minute default.
#   native_s: 1800
#   # Cap on the execute → judge → re-dispatch loop per task. Default 5.
#   supervise_rounds: 5
#   # Per-task metered-token quota (§6.1) stamped on newly created local
#   # tasks: every agent round and judge call draws it down, and an exhausted
#   # task parks in review instead of burning on. Default 2000000 (input +
#   # output tokens; cache reads are not counted). Set -1 to leave new tasks
#   # unbounded (the pre-budget behaviour).
#   task_token_budget: 2000000

# Sibling-message board (inter-task notes within one plan or one parent's
# child set). The board meters rather than forbids: a sender past its budget
# is told so and carries on with local work.
# messages:
#   # How many sibling messages one task episode may send. Default 8.
#   budget: 8

# Self-update channel. Defaults to the official GitHub releases; the knobs
# are env-only (never written to this file):
#   OPENPANDA_UPDATE_REPO      "owner/repo" of a self-hosted release channel.
#   OPENPANDA_UPDATE_PUBKEY    Ed25519 public key (hex or base64). When set, a
#                              release must ship checksums.txt.sig — a detached
#                              signature over checksums.txt — or the update is
#                              refused. Every build carries the official
#                              channel's key already (internal/version.
#                              ReleasePubKey); set this only to verify a
#                              self-hosted channel against its own key.
#                              Official release key:
#                              a84a556bd45ee7743437d7b9b0c4f6e0df34c496f639b5a045d5de484f128560
#   OPENPANDA_UPDATE_UNSIGNED  any non-empty value skips signature
#                              verification for that run — the escape hatch
#                              for unsigned self-hosted channels.
# Produce a signature for a self-hosted release with:
#   openssl pkeyutl -sign -rawin -inkey ed25519.pem \
#     -in checksums.txt | base64 > checksums.txt.sig

# Web Push notifications (design P3-26): task entering review → phone push.
# Read by the embedded console (`panda web`); requires a secure context —
# HTTPS, or loopback which browsers already treat as secure.
# VAPID key is auto-generated and persisted at vapid_key_path on first boot
# (keep it stable).
push:
  enabled: false                  # true to serve /api/push/* and send pushes
  vapid_subject: "mailto:panda@localhost"
  vapid_key_path: "./data/vapid.pem"

# Front-end preferences. `locale` is the language /lang last switched to in
# the REPL/TUI; empty (or omitted) follows the terminal's LANG/OPENPANDA_LANG.
# OPENPANDA_LANG still wins over this setting when set.
#
# `mouse` decides who owns the terminal mouse in the full-screen TUI:
#   "select" (default) — the terminal keeps it, so drag-select, double-click and
#                        the terminal's own copy shortcut work; the wheel still
#                        scrolls the transcript through alternate scroll.
#   "scroll"           — the app captures it, so the wheel pages the transcript
#                        and clicks answer the approval buttons, at the cost of
#                        terminal-native selection.
# Either way PageUp/PageDown scroll, ctrl+t switches the mode live, and
# PANDA_MOUSE=select|scroll overrides this setting for a single run.
# ui:
#   locale: "zh-CN"               # en | zh-CN | ja | es | de
#   mouse: "select"               # select | scroll

# ── Speech-to-text (the composer's dictation button) ──────────────────────
# The web console records in the browser and POSTs the clip to the node, which
# relays it to an OpenAI-compatible `POST {base_url}/audio/transcriptions`
# (multipart `file` + `model`). Browsers that ship their own recogniser use it
# first; this section is what they fall back to, and the only path in Firefox.
#
# Empty is a working default: base_url and api_key are inherited from the
# active model, and `model` falls back to whisper-1 — the relay that answers
# chat usually answers Whisper too. Set the section only when speech lives
# somewhere else, or when the relay has no Whisper at all.
# asr:
#   base_url: "https://api.openai.com/v1"
#   api_key: ""                   # prefer env OPENPANDA_ASR_KEY where possible
#   model: "whisper-1"
#   language: ""                  # ISO-639-1 ("zh", "en"); empty = auto-detect.
#                                 # Leave it empty unless you always speak one
#                                 # language — a wrong hint degrades accuracy.

# ── Self-evolution (v0.2.x, opt-in, off by default) ──────────────────────
# Lets this node merge signed patch sets produced by itself (or, later, mesh
# peers) through the review queue: `panda self` mints/imports a set, it parks
# as a review task, and `panda approve` runs the merge — worktree apply,
# full `make gate`, build, staged swap through the SAME updater path an
# official release takes. The release-signed binary stays beside the install
# as panda.release; `panda self rollback` restores it.
#
# Requirements are developer-grade: go, git, make, python3, and a C toolchain
# for the gate's CGO race leg. `panda self doctor` preflights the box.
# self_evolution:
#   enabled: false
#   repo: ""                      # REQUIRED when enabled: this node's OpenPanda
#                                 # checkout — the merge worktree is a detached
#                                 # `git worktree add` under <data>/self/.
#   producers: "self"             # self | mesh — whose signed patch sets a merge
#                                 # proposal accepts. mesh reserves the phase-5
#                                 # cross-node transfer; today only this node's
#                                 # own key mints mergeable sets.
#   rebase_on_update: true        # after an official update lands on a
#                                 # self-built node, try rebasing queued sets
#                                 # onto it; a conflict marks the set and the
#                                 # node stays on the release binary.
