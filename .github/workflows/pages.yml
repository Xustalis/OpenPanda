name: Pages

# Deploys the static marketing site in site/ to GitHub Pages. Path-filtered so
# Go changes don't redeploy the page and page changes don't touch the gate.
# CHANGELOG.md is in the filter on purpose: a new release must not publish a
# site that still advertises the previous version (check-site.py asserts it).
#
# The validation step runs before the artifact is uploaded, so a broken page
# blocks the publish instead of replacing the live one. Equivalent locally:
# `make site-check`.
#
# Repo Settings → Pages → Source is already "GitHub Actions"; this workflow is
# what actually publishes. It was dropped in e141550 while the site was still
# being written and restored when the site shipped.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CHANGELOG.md'
      - 'scripts/check-site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A deploy is upload + publish, a couple of minutes end to end. The first
    # run after this workflow was restored sat in the queue for 20 minutes with
    # no runner assigned and no failure — a bounded job at least turns that into
    # a red X that can be re-run, instead of a yellow dot that looks like work
    # in progress. Re-dispatch with `gh workflow run pages.yml` if it does.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate site invariants
        run: python3 scripts/check-site.py

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
