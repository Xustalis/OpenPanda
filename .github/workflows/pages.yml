name: Pages

# Deploys the static marketing site in site/ to GitHub Pages. Path-filtered
# so Go changes don't redeploy the page and page changes don't touch the
# gate. `enablement: true` asks configure-pages to create the Pages site the
# first time this runs; if the workflow token lacks administration rights on
# the repo that call comes back 403, in which case the one-time manual step
# remains: repo Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deployment
        uses: actions/deploy-pages@v4
