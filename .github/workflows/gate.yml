name: Gate

# CONTRIBUTING.md promises "a pull request is merged only when all gates are
# green". Until this workflow existed that sentence described nothing: the only
# two workflows ran on push-to-main and on a tag, so a pull request could land
# without ever building. This is the enforcement half of that promise.
#
# The checks run as independent parallel jobs instead of one serial `make
# gate-all`: feedback lands as fast as the slowest single leg instead of the sum
# of all of them, and a fmt failure no longer waits behind a compile. The
# race leg is scoped to the concurrency-hot packages (`make race-focused`) —
# the full-suite race was the cost driver of the old serial gate while every
# goroutine the detector exists for lives in core/commander/bus/storage.
#
# Every leg here is also reachable locally through `make gate-all`; keep the two
# in step, or a check that only ever runs in CI becomes unreproducible.
#
# Deliberately no `paths-ignore` on the pull_request trigger. Skipping a
# workflow on a docs-only diff is only safe while this gate stays advisory: the
# moment a skipped job is listed as a required status check, GitHub leaves it
# "Expected" forever and the pull request can never be merged. A three-minute
# gate on a README change is cheaper than that failure mode, so the gate always
# runs.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keyed by event as well as ref so a manual re-run cannot cancel the
  # push-triggered run for the same commit: a cancelled Gate is not a green
  # Gate, and the release preflight reads this workflow's conclusion for that
  # exact commit. Push runs still supersede each other, which is the point of
  # cancel-in-progress.
  group: gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # The toolchain is declared once, in go.mod. A floating '1.26.x' here
          # resolved to whatever patch release the runner happened to fetch, so
          # CI and every local build could compile the same commit with
          # different compilers — and the stdlib's own vulnerability status
          # changed underneath the project without a commit.
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: make fmt-check
      # go.mod/go.sum must be exactly what `go mod tidy` produces: an untidy
      # module graph is how a dependency enters the build without ever
      # appearing in a reviewed diff.
      - name: Module tidiness
        run: go mod tidy -diff
      - name: go vet
        run: make vet
      # staticcheck covers what vet deliberately skips (SA*/S1*/QF* classes).
      # Pinned in the Makefile so a linter release cannot surprise-fail an
      # unchanged tree — same reason gotestsum is pinned below.
      - name: staticcheck
        run: make staticcheck
      # The lite variant (-tags lite: no embedded console, no TUI) is built by
      # package.sh for the lite-linux release targets, and those run only on a
      # push to main. A symbol that lives in a //go:build !lite file but is
      # referenced from a shared one therefore compiles everywhere except the
      # lite build — which is how `undefined: truncate` reached main and broke
      # packaging. Compile every variant here instead.
      - name: lite build
        run: go build -tags lite ./...
      # Doc-drift guard: the retired deepseek-chat alias must not linger in
      # READMEs/example configs, and install.md version examples must track
      # the latest release tag.
      - name: Docs drift check
        run: sh scripts/check-docs.sh
      # Supply-chain guard: a third-party action referenced by a mutable tag
      # runs whatever the upstream owner pushes to that tag, with this
      # repository's token and write permissions — no diff, no review. Every
      # action must therefore be pinned to a commit SHA.
      - name: Action pin check
        run: sh scripts/check-actions-pinned.sh

  # Reachable-vulnerability scan. Separate from `lint` because it needs the
  # vulnerability database over the network and its own module download, which
  # would make the fast leg depend on an external service. Its absence was a
  # real gap: GO-2026-6809 (crypto/x509 intermediate certificate handling) was
  # reachable from bus.Client.Dial on the previously pinned Go 1.26.9 toolchain,
  # and nothing in this workflow was asking. `go-version-file: go.mod` picks up
  # the fixed 1.26.10 from the same declaration every other leg uses.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: make vuln

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # No separate `go build ./...` step: `go test ./...` compiles the same
      # package graph before it runs anything, so the build was a second full
      # compile per run that could only ever report what the test step was
      # about to report anyway.
      - name: Test
        run: go test ./...

  # The bundled Python adapters have a Go-invisible surface: their subprocess
  # argv, env, progress stream and timeout behavior are pinned by the
  # black-box contract suite (fake CLIs first on PATH, no network). Without
  # this leg an adapter regression — e.g. a silently dropped CLI flag — ships
  # green.
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - name: Adapter contract tests
        run: make adapter-test

  # The TUI's mouse-ownership contract lives in the bytes the binary writes to
  # the tty, which no unit test can see: whether it asks the terminal for
  # cell-motion reporting (that is what silently kills drag-select, double-click
  # and copy) and whether the alternate-scroll flag follows a ctrl+t round trip
  # (miss the re-arm and the wheel is dead after the switch back). Drives the
  # real binary in a pty. Needs both Go and python3, so it is its own leg.
  #
  # Two contracts, not one: `tui-pty-exit-test` (the "chat saved / resume" note
  # on the restored screen, and a failed turn persisted to the convo file) is
  # part of `make gate-all` and was in no CI job at all — a check that only
  # ever ran on a developer's laptop. Both run here now.
  #
  # macOS is in the matrix because `cmd/panda/term_darwin.go` takes the other
  # branch of the terminal setup (term_unix.go is what Linux exercises), and
  # the two scripts were written for macOS/Linux from the start. Windows has no
  # pty, so it stays out.
  tui-pty-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      - name: TUI mouse ownership (pty)
        run: make tui-pty-test
      - name: TUI exit visibility (pty)
        run: make tui-pty-exit-test

  # The review ruleset requires the bare `tui-pty` context, but a matrix job's
  # check names carry their axis value ("tui-pty (macos-15)"), so the required
  # context would sit "Expected" forever and no PR could merge. This summary
  # carries the required name and passes only when every platform run passed —
  # a failed (or skipped) matrix leg skips it, which the ruleset counts as not
  # green.
  tui-pty:
    needs: tui-pty-run
    runs-on: ubuntu-latest
    steps:
      - name: Both platform contracts passed
        run: echo "TUI pty contracts passed on ubuntu-latest and macos-15"

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # The race detector over the packages that actually share state across
      # goroutines and connections. `make race` (full suite) stays available
      # locally for release preparation.
      - name: Race (concurrency-hot packages)
        run: make race-focused

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node 24: the console's tests are .ts files run straight through
      # `node --test`, which needs built-in type stripping (23.6+/24) and
      # glob arguments (21+) — Node 20 could neither, and the test step
      # died on its first test file.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/app/package-lock.json
      # npm ci, not npm install: this leg answers "does this tree build", and
      # `npm install` is free to resolve a different dependency tree than the
      # lockfile everything else is pinned to.
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # Proves the embedded-console build lands where go:embed expects it.
      - name: Build
        run: npm run build
      - name: Verify embed output
        run: test -f ../panel/dist/app/index.html

  # The installers were the last untested surface. installers.yml builds and
  # checksum-verifies the archives but never *runs* install.sh / install.ps1,
  # and the cross-platform job only compiles and tests Go — so every
  # platform-only branch in an installer (arch mapping, rc-file / registry
  # PATH persistence, service-registration failure handling, checksum refusal)
  # shipped unexecuted, and a PowerShell parse error would have been found by
  # the first user rather than by CI.
  #
  # The tests stage a release archive locally and address it through file://
  # URLs, so they need no published release and no network, and run on both
  # platforms they cover. They deliberately do not build the web console: the
  # installer only ever runs `panda version`, and `go build` already succeeds
  # against the committed dist placeholder.
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Installer end-to-end (POSIX)
        if: runner.os != 'Windows'
        run: sh scripts/test-installers.sh
      - name: Installer end-to-end (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-installers.ps1

  # The daemon is expected to run on Windows and macOS nodes, so the test suite
  # has to pass there too — a Windows-only path breaking is exactly the class of
  # bug a Linux-only gate cannot see.
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      # Kept as its own step here, unlike in the Linux `test` job: on these two
      # OSes a compile-only break is worth separating from a test failure,
      # because the failure output that follows it is otherwise easy to
      # misread as a flaky test rather than a platform-specific build error.
      - name: Build
        run: go build ./...
      # The internal/core e2e tests poll real loopback websockets on fixed
      # ports, and shared-CPU macOS/Windows runners stall them often enough
      # to flake dependabot PRs twice in a row (TestPlanThreeStagesThreeNodes,
      # TestDeclineTerminalizesLocalRow — both green on retry and locally).
      # `--rerun-fails` re-runs only the tests that failed, so a consistent
      # regression still fails the leg while a one-off stall does not hold
      # the gate hostage. A data-race failure is never retried.
      - name: Test (rerun only failures — these runners stall the loopback e2e tests)
        run: go run gotest.tools/gotestsum@v1.13.0 --rerun-fails=3 --rerun-fails-abort-on-data-race --packages="./..."
      # The adapters are Python and run on Windows/macOS nodes, but their
      # black-box contract suite only ran on the Linux `adapters` job — the
      # win32 branches in adapters/_harness.py (`.cmd` shim resolution, UTF-8
      # stdio, taskkill /T) were exercised only through a patched
      # sys.platform, never on a real Windows host. The suite lays down
      # platform-appropriate fake CLIs and pins UTF-8 on both sides, so it can
      # run as-is here.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.x'
      # Separate steps rather than one command: setup-python installs `python3`
      # on Unix and `python` on Windows, and one spelling cannot cover both.
      - name: Adapter contracts (POSIX)
        if: runner.os != 'Windows'
        run: python3 tests/adapter_contract_test.py
      - name: Adapter contracts (Windows)
        if: runner.os == 'Windows'
        run: python tests/adapter_contract_test.py
