name: Installers

# Post-merge canary for the public installer path. It repackages the tree and
# installs that package through scripts/install.sh and scripts/install.ps1 —
# the same entry points users run — so a broken archive layout, a checksum
# mismatch or an installer regression is caught on main instead of by a user.
#
# Docs-only pushes are skipped: this workflow validates binaries, and five
# translated CHANGELOGs plus five READMEs changing cannot alter one. Any Go,
# script, Makefile or workflow change still runs it in full.
#
# Unlike the Gate, skipping is safe here precisely because this can never be a
# required status check — it asserts nothing about a pull request.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/app/package-lock.json
      # scripts/package.sh bakes the embedded console out of
      # webui/panel/dist/app, and has always documented `make web` as its
      # prerequisite — but nothing here ever ran it, so this job validated
      # installers against a binary carrying the committed placeholder UI
      # rather than the one users download. Package the real artifact.
      - name: Build web console (embedded into binary)
        run: make web
      - name: Package all supported targets
        run: make package VERSION=0.0.0-test
      - name: Verify installer asset contract
        run: ./scripts/verify-release.sh 0.0.0-test
      - uses: actions/upload-artifact@v7
        with:
          name: installer-assets
          path: dist/

  unix-install:
    needs: package
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: installer-assets
          path: dist
      - name: Install through the public shell-installer path
        shell: bash
        run: |
          python3 -m http.server 8765 --directory dist >/tmp/openpanda-installer-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8765/checksums.txt >/dev/null && break
            sleep 1
          done
          test_home="$RUNNER_TEMP/openpanda-home"
          mkdir -p "$test_home"
          HOME="$test_home" OPENPANDA_RELEASE_BASE=http://127.0.0.1:8765 \
            sh scripts/install.sh --version 0.0.0-test --prefix "$test_home/openpanda" --no-service
          "$test_home/openpanda/bin/panda" version | grep 0.0.0-test

  windows-install:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: installer-assets
          path: dist
      - name: Install through the public PowerShell-installer path
        shell: powershell
        run: |
          $server = Start-Process python -ArgumentList '-m','http.server','8765','--directory','dist' -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..10) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8765/checksums.txt' | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw 'local release server did not become ready' }
            $env:OPENPANDA_RELEASE_BASE = 'http://127.0.0.1:8765'
            $prefix = Join-Path $env:RUNNER_TEMP 'OpenPanda'
            & .\scripts\install.ps1 -Version 0.0.0-test -Prefix $prefix -NoService
            & (Join-Path $prefix 'bin\panda.exe') version | Select-String '0.0.0-test'
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }
