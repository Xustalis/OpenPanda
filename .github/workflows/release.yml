name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish at the selected ref (blank: v<Version> from version.go)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Needed by the preflight job to read the Gate workflow's runs for this
  # commit. Declaring `contents` alone would set everything else to none.
  actions: read

jobs:
  # A release used to start only when somebody pushed a `v*` tag — and the
  # tag push was a manual step with nothing watching for it, so a merged
  # release PR could sit unpublished indefinitely (v0.0.10-preview did).
  # The version bump is the actual release intent: internal/version/version.go
  # only changes in release PRs, so a push to main that touches it IS the
  # release request, and this job turns it into one automatically. Manual
  # `v*` tag pushes still work, and workflow_dispatch re-runs a publish —
  # e.g. after a transient packaging failure — without re-bumping anything.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deciding diffs the pushed range against version.go, which needs
          # the pre-push tip — a depth-1 checkout doesn't have it.
          fetch-depth: 0
      - name: Decide whether this run publishes a release
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          release=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
            [ -n "$tag" ] || tag="v$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/version/version.go)"
            release=true
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            release=true
          else
            tag="v$(sed -n 's/^var Version = "\(.*\)"/\1/p' internal/version/version.go)"
            # `before` is all-zeros when the push creates the ref (or the
            # event predates it); for a merge the first parent is the same
            # "previous main tip" the diff wants anyway.
            before="$BEFORE"
            [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
              || before="$GITHUB_SHA^1"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "tag $tag already exists — nothing to publish"
            elif [ -n "$(git diff --name-only "$before" "$GITHUB_SHA" -- internal/version/version.go)" ]; then
              echo "version.go changed in this push and $tag is untagged — releasing"
              release=true
            else
              echo "version.go untouched by this push — not a release"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # A tag push and a main-branch push are two independent events with no
  # ordering between them, so nothing stopped a tag on a red tree from
  # publishing. The previous shape closed that hole by re-running the whole
  # gate here — build plus the full Go test suite — which was both a second
  # full CI run per release and a weaker promise than it looked: a release
  # could still ship if the duplicate run happened to pass while the real gate
  # failed, and the two could disagree because nothing tied them together.
  #
  # Asking Gate for its verdict on this exact commit is strictly stronger and
  # nearly free: the release either waits for that run to finish green or
  # refuses to publish.
  preflight:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a green Gate for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          deadline=$(( SECONDS + 900 ))
          while :; do
            read -r status conclusion <<<"$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/gate.yml/runs?head_sha=${sha}&event=push&per_page=1" \
                --jq '(.workflow_runs[0] // {}) | "\(.status // "missing") \(.conclusion // "-")"'
            )"
            case "$status" in
              completed)
                if [ "$conclusion" = "success" ]; then
                  echo "Gate is green for ${sha}"
                  exit 0
                fi
                echo "Gate concluded '${conclusion}' for ${sha} — refusing to publish" >&2
                exit 1
                ;;
              missing)
                echo "No push-triggered Gate run exists for ${sha}." >&2
                echo "The tag must point at a commit whose Gate run on main is still within the runs retention window." >&2
                exit 1
                ;;
              *)
                echo "Gate for ${sha} is ${status}; waiting for it to finish"
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out after 15m waiting for the Gate run of ${sha}" >&2
              exit 1
            fi
            sleep 20
          done

  release:
    needs: [resolve, preflight]
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/app/package-lock.json

      # Nothing here re-compiles or re-tests the tagged commit: preflight
      # already established that Gate built and tested precisely this SHA, and
      # `make package` cross-compiles it anyway.
      - name: Build web console (embedded into binary)
        run: make web

      - name: Package releases (cross-compile + archive + checksums)
        run: make package VERSION="$VERSION"

      - name: Verify checksums
        run: ./scripts/verify-release.sh "$VERSION"

      - name: Render checksum-pinned Homebrew formula
        run: ./scripts/render-homebrew-formula.sh "$VERSION"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        # Pull the tagged version's section out of the canonical changelog so
        # the GitHub Release body mirrors it (generate_release_notes alone
        # only lists commits, which told users nothing in 0.0.5). The body is
        # English-only by convention; a language switcher line at the top
        # links to the translated CHANGELOGs, and the standard install
        # commands close it out — the release page is where new users land
        # first. Full section headers ("## [X.Y.Z]") are demoted one level so
        # the body renders with sane hierarchy.
        run: |
          ver="$VERSION"
          notes="dist/release-notes.md"
          section="dist/changelog-section.md"
          mkdir -p dist
          # The heading pattern tolerates an escaped bracket ("## \[X.Y.Z\]")
          # in addition to the plain one — a local Markdown formatter has been
          # observed escaping these headings on save, and without the
          # tolerance the extraction silently finds nothing and the release
          # refuses to publish.
          awk -v ver="$ver" '
            $0 ~ "^## \\\\?\\[" ver "\\]" { in_section=1; sub(/^## /, "### "); print; next }
            in_section && /^## \\?\[/ { in_section=0 }
            in_section && /^### / { sub(/^### /, "#### "); print; next }
            in_section { print }
          ' CHANGELOG.md > "$section"
          if [ ! -s "$section" ]; then
            echo "CHANGELOG.md has no section for $ver — refusing to publish an empty body" >&2
            exit 1
          fi
          # The release title carries the codename when the section's intro
          # line declares one ("codename **Periapsis**"), so release pages,
          # feeds, and the updater's "v0.0.9 Periapsis" notices all say the
          # same thing. A section without a codename falls back to the bare tag.
          codename="$(sed -nE 's/.*codename \*\*([^*]+)\*\*.*/\1/p' "$section" | head -n1)"
          if [ -n "$codename" ]; then
            echo "release_name=$TAG $codename" >> "$GITHUB_OUTPUT"
          else
            echo "release_name=$TAG" >> "$GITHUB_OUTPUT"
          fi
          repo="https://github.com/Xustalis/OpenPanda/blob/main"
          printf '%s\n\n' "**Release notes:** English · [简体中文]($repo/CHANGELOG.zh-CN.md) · [日本語]($repo/CHANGELOG.ja.md) · [Español]($repo/CHANGELOG.es.md) · [Deutsch]($repo/CHANGELOG.de.md)" > "$notes"
          cat "$section" >> "$notes"
          cat >> "$notes" <<'INSTALL'

          ---

          ## Install

          **macOS / Linux**

          ```sh
          curl -fsSL https://raw.githubusercontent.com/Xustalis/OpenPanda/main/scripts/install.sh | sh
          ```

          **Windows (PowerShell)**

          ```powershell
          irm https://raw.githubusercontent.com/Xustalis/OpenPanda/main/scripts/install.ps1 | iex
          ```

          **macOS (Homebrew)**

          ```sh
          brew install Xustalis/openpanda/openpanda
          ```

          After installing, run `panda init` to set the node up, or just type `panda` to drop into the REPL. An older install upgrades in place with the same command — user data is preserved.
          INSTALL

      # The tag-push path arrives with its tag already on the remote; the
      # automatic and dispatch paths may not, so the tag is created here —
      # annotated, matching the maintainer's manual releases. A tag pushed
      # by GITHUB_TOKEN does not retrigger this workflow (GitHub suppresses
      # cascading workflow runs), so this cannot recurse.
      - name: Create the release tag if missing
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "$TAG" "$GITHUB_SHA" -m "OpenPanda $TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Explicit on both counts: on the tag-push path these equal the
          # triggering ref anyway, on the automatic path they are what tie
          # the release to the tag the previous step just created.
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.notes.outputs.release_name }}
          body_path: dist/release-notes.md
          # Appends the generated "What's Changed" commit summary below the
          # changelog body — the body carries the narrative, this carries the
          # commit-by-commit archaeology and the contributor list.
          generate_release_notes: true
          # A hyphenated tag is a pre-release (v0.0.8-preview, v0.0.8-alpha,
          # v1.0.0-rc1); a bare vX.Y.Z is not. This has to be explicit: the
          # action does not infer it from the tag name, and a release that is
          # *not* marked pre-release becomes the repository's "Latest" — which
          # is the release `api.github.com/repos/.../releases/latest` returns,
          # i.e. what scripts/install.sh and install.ps1 hand to every new
          # user. Shipping a preview there would move the whole install
          # channel onto an untested build. Marking it pre-release keeps
          # /releases/latest on the last stable tag while the preview stays
          # downloadable by explicit version.
          prerelease: ${{ contains(needs.resolve.outputs.tag, '-') }}
          files: |
            dist/panda-*.tar.gz
            dist/panda-*.zip
            dist/checksums.txt
            dist/openpanda.rb

      # Homebrew has no pre-release concept: the tap is one formula, so
      # whatever lands in Formula/openpanda.rb is what `brew install
      # Xustalis/openpanda/openpanda` installs. Writing a preview version there
      # would move the brew channel off stable even though the GitHub release
      # is correctly marked pre-release, so the tap only ever tracks bare
      # vX.Y.Z tags.
      - name: Update Homebrew tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' && !contains(needs.resolve.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ env.HOMEBREW_TAP_TOKEN }}
        run: |
          work="$(mktemp -d)"
          gh repo clone Xustalis/homebrew-openpanda "$work/tap"
          mkdir -p "$work/tap/Formula"
          cp dist/openpanda.rb "$work/tap/Formula/openpanda.rb"
          cd "$work/tap"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/openpanda.rb
          git diff --cached --quiet || git commit -m "openpanda $TAG"
          # gh repo clone leaves an unauthenticated https remote; push with the
          # token embedded so git never prompts for credentials in CI.
          git push "https://x-access-token:${GH_TOKEN}@github.com/Xustalis/homebrew-openpanda.git"
