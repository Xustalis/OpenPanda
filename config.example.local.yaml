# 本地单节点（loopback）最小配置示例
# 复制为 config.local.yaml 后按需调整：
#   cp config.example.local.yaml config.local.yaml
# 注意：config.local.yaml 不会被自动发现（自动发现顺序是 --config 参数 >
# OPENPANDA_CONFIG_PATH > 用户配置目录 > 系统默认路径）。必须显式指定：
#   panda daemon --config config.local.yaml
# 或：
#   export OPENPANDA_CONFIG_PATH=$PWD/config.local.yaml
# 密钥与令牌请通过环境变量注入，不要写入此文件：
#   export OPENPANDA_SHARED_SECRET=...
#   export OPENPANDA_PANEL_TOKEN=...
#   export OPENPANDA_MODEL_API_KEY=...
node:
  name: "local-node"
  resource_class: "Standard"

network:
  listen_addr: "127.0.0.1:7840"
  shared_secret: ""  # 留空即可，单节点不需要 P2P
  panel_addr: "127.0.0.1:7841"   # webui 面板（panda web）HTTP 地址
  panel_token: ""                # 留空；经 OPENPANDA_PANEL_TOKEN 注入
  # LAN 自动发现（Track 1）：UDP 广播 beacon 宣告"本机有 panda"，
  # 对端 `panda nodes` 看到未配对列表 → nodes admit/verify 入网。
  # 数据报不含凭据；入网仍要求 shared_secret + Ed25519 hello。
  # "" 默认 :7837；"off" 完全关闭（不广播也不监听）。
  # discovery_addr: ":7837"
  # 明文 ws:// 出站门禁：hello 只证明成员身份，握手后的帧仍明文无签名——
  # 明文链路上的 MITM 可以伪造 task_delegate（即远程执行）。默认拒绝拨往
  # 非安全地址的 ws://：回环与 Tailscale（100.64.0.0/10、fd7a:115e:a214::/48、
  # *.ts.net）天然加密放行；其余请改用 wss://（listener 本身无 TLS，需在
  # 前面终结）、punch:<id>（AEAD 数据报），或显式开启下方开关接受明文。
  # allow_cleartext: false

storage:
  db_path: "openpanda.db"
  context_path: "data/context"
  memory_path: "memory"
  projects_path: "projects"
  skills_path: "skills"
  work_path: "."
  # 任务产物池：跨节点搬运的打包产物按哈希命名存放在此。
  # 不用 ctxstore（Micro 节点 LRU 只留 5 条，会被静默淘汰），也不入 SQLite（产物按 GB 计）。
  artifact_path: "artifacts"
  # 额外的产物卷：写盘时自动落到「可用空间−水位线」余量最大的卷——扩容量，不是做副本。
  artifact_extra_paths: []
  # 单个产物字节上限。0（缺省）= 不限：传输按 1MiB 分片流式进行，大小不占内存，
  # 边界就是磁盘剩余空间——声明总量超过可用空间的推送会在第一字节落地前被拒。
  # 仅在产物与关键状态共享小磁盘时才需要设限。
  artifact_max_bytes: 0
  # 每个卷保留的最小剩余空间：产物可以任意大，但不能把卷写到这条线以下——
  # 写满的文件系统会拖垮 SQLite 的 WAL。缺省 256MiB，显式 0 关闭。
  artifact_min_free_bytes: 268435456

model:
  api_type: ""       # anthropic | openai（缺省 anthropic）
  base_url: ""       # 如 provider 需要自定义 endpoint
  model: ""          # 如 claude-opus-4, gpt-4o-mini, deepseek-v4-flash ...
  api_key: ""        # 留空；优先经 OPENPANDA_MODEL_API_KEY 注入
  # auth: ""         # 订阅 OAuth provider（experimental）：先 `panda auth login
                     # anthropic`，再设 auth: anthropic 即改用订阅 Bearer token
                     # 认证（自动刷新），此时 api_key 可留空
  # 重试预算：模型请求失败（429 / 5xx / 断连）后的重试次数上限。
  # 缺省 5；负数完全关闭重试。退避步长封顶 30s，大预算不会变成忙等。
  # max_retries: 0

# 联网搜索（web_search/web_fetch 工具）：模型查最新新闻、版本发布等时效性内容的通道。
# provider: auto（缺省，按已配置项推断）| searxng | brave | tavily | bocha | off（关闭联网工具）
# auto 推断规则：配了 base_url 用 searxng（自建实例）；配了 api_key 用 brave。
# 密钥优先经环境变量注入，不要写进此文件：
#   export OPENPANDA_SEARCH_API_KEY=...      （brave / tavily / bocha 通用）
#   也识别各家惯用的 BRAVE_SEARCH_API_KEY / TAVILY_API_KEY / BOCHA_API_KEY
# search:
#   provider: "auto"
#   base_url: ""        # searxng 实例地址，如 https://searx.example.org（实例须开启 format=json）
#   api_key: ""         # brave / tavily / bocha 的密钥
#   max_results: 8      # 每次搜索返回给模型的结果条数（1-20）

log:
  level: "info"

# 模型注入策略：auto = agent 自带模型凭证时不注入，否则注入 panda 配置的模型
# （注入时会在任务输出开头声明并写入审计/事件流）；always = 总是注入；never = 永不注入
injection:
  model: "auto"

# 路由偏好：列出的 agent 在评分时获得 +0.5 加权；首选 agent 不可用时自动顺延下一个
# tools_policy: minimal(默认，安全白名单) | extended(放开 agent 原生工具/MCP)
# panda_tools: extended 策略下是否向 agent 暴露 OpenPanda 自管理工具（panda mcp），默认 true
# routing:
#   preferred_agents: []
#   tools_policy: minimal
#   panda_tools: true

# 记忆文件字符上限（缺省即使用默认值）
# memory:
#   limits:
#     user: 5000
#     memory: 10000
#     project: 30000

# 任务审批：always = 每次都需审批；on-request = 仅高风险任务；never = 从不审批
# approval:
#   mode: "on-request"

# 子进程 OS 沙盒：对每一个派生的 native 命令和 agent 适配器套平台级隔离。
#   off      —— 默认；只做环境变量过滤和工作目录，没有 OS 边界（历史行为）
#   standard —— deny-default 写隔离：只能写任务目录 + 白名单运行时目录，
#               其余写入 EPERM；deny_write_paths 里的路径即使在白名单父目录下也不可写
#   strict   —— standard + 拒读系统凭证位（~/.ssh、~/.aws、其它 agent 的凭证目录、
#               shell 历史……）和 deny_read_paths
# 后端：macOS 用 sandbox-exec（seatbelt），Linux 用 bubblewrap（需安装 bwrap），
# 无后端的平台配置 mode 为空转并在启动时告警。
# sandbox:
#   mode: "standard"
#   # 完全切断子进程出网（默认允许 —— 端点白名单由 network guard 管）
#   # allow_network: false
#   # 额外放行写入（绝对路径、~ 开头或裸名都会按 $HOME 解析）
#   # writable_paths: ["~/projects/shared"]
#   # 连读都拒绝（仅 strict 生效）
#   # deny_read_paths: ["~/Documents/private"]
#   # 禁止写入（节点自己的 db/记忆/配置文件自动在列）
#   # deny_write_paths: []

# 长任务时间预算（单位：秒；留空或删掉即用内置默认值）。
# 深度学习这类任务动辄跑几小时，而默认值是按"改一段代码"调的，所以这三个旋钮必须能改。
# timeouts:
#   # 一次任务尝试能持有租约多久，超时后监控视执行方已死并重新路由。
#   # 执行期间会按 lease/3 心跳续租，所以它约束的是"执行方失联多久"，不是任务总时长。
#   # 默认 1200。必须明显大于 agent_s：租约在适配器还在正常跑的时候过期，
#   # 任务会被强制失败并重新分发，同一份活会在两台机器上同时跑第二遍。
#   task_lease_s: 1200
#   # 单次 agent 适配器执行的墙钟预算（会告知适配器，并以硬 deadline 强制执行）。默认 600。
#   agent_s: 600
#   # 单个任务的 执行 → 评审 → 重新分发 循环上限。默认 5。
#   supervise_rounds: 5

# 并发能力卡（并发上限等）不在本文件配置，由 capabilities.yaml 能力卡声明。
