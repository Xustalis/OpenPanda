/* OpenPanda Console Design System — dark-first, bamboo-green accent, warm panda neutrals */

:root {
  color-scheme: dark;

  /* Core surfaces */
  --op-background: #0f1310;
  --op-foreground: #e8ece7;
  --op-card: #161d18;
  --op-card-foreground: #e8ece7;
  --op-popover: #161d18;
  --op-popover-foreground: #e8ece7;
  --op-muted: #1d2620;
  --op-muted-foreground: #8fa094;

  /* Brand primary */
  --op-primary: #3aa673;
  --op-primary-foreground: #0a2317;

  /* Borders and inputs */
  --op-border: #28322b;
  --op-border-soft: #1f2822;
  --op-input: #28322b;
  --op-ring: #55c78d;

  /* Semantic aliases for internal consistency */
  --op-bg: #0f1310;
  --op-bg-raised: #161d18;
  --op-bg-inset: #0b0f0c;
  --op-bg-hover: #1d2620;
  --op-text: #e8ece7;
  --op-text-dim: #8fa094;
  --op-accent: #55c78d;
  --op-accent-strong: #3aa673;
  --op-accent-ink: #0a2317;
  --op-accent-soft: rgba(85, 199, 141, 0.14);

  /* State colors */
  --state-success: #55c78d;
  --state-warning: #e2b93b;
  --state-error: #ef6a6a;
  --state-info: #6db3f2;

  /* Radius scale */
  --op-radius-small: 4px;
  --op-radius-medium: 8px;
  --op-radius-large: 12px;
  --op-radius-full: 9999px;

  /* Panda brand accents */
  --op-panda-head: #f7f3ea;
  --op-panda-blush: #f2a7b3;

  /* Depth */
  --op-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 28px rgba(0, 0, 0, 0.22);

  /* Typography */
  --op-font:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
    'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --op-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Density */
  --op-sidebar-width: 212px;
  --op-header-height: 56px;
  --op-mobile-nav-height: 56px;
}

  <script>
    lucide.createIcons();

    // Theme toggle
    const themeBtns = document.querySelectorAll('.theme-btn');
    function setThemeButtons(value) {
      themeBtns.forEach(btn => {
        const active = btn.dataset.themeValue === value;
        btn.classList.toggle('bg-primary', active);
        btn.classList.toggle('text-primary-foreground', active);
        btn.classList.toggle('text-muted-foreground', !active);
      });
    }
    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const value = btn.dataset.themeValue;
        if (value === 'auto') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', value);
        }
        setThemeButtons(value);
      });
    });

    // Push toggle demo
    const pushToggle = document.getElementById('push-toggle');
    pushToggle.addEventListener('click', () => {
      const pressed = pushToggle.getAttribute('aria-pressed') === 'true';
      pushToggle.setAttribute('aria-pressed', String(!pressed));
      pushToggle.classList.toggle('bg-primary', !pressed);
      pushToggle.classList.toggle('bg-muted', pressed);
      pushToggle.querySelector('span').classList.toggle('translate-x-5', !pressed);
      pushToggle.querySelector('span').classList.toggle('translate-x-0', pressed);
    });
  </script>
