    <style id="theme-vars">
/* OpenPanda Console Design System — dark-first, bamboo-green accent, warm panda neutrals */

:root {
  color-scheme: dark;

  /* Core surfaces */
  --op-background: #0f1310;
  --op-foreground: #e8ece7;
  --op-card: #161d18;
  --op-card-foreground: #e8ece7;
  --op-popover: #161d18;
  --op-popover-foreground: #e8ece7;
  --op-muted: #1d2620;
  --op-muted-foreground: #8fa094;

  /* Brand primary */
  --op-primary: #3aa673;
  --op-primary-foreground: #0a2317;

  /* Borders and inputs */
  --op-border: #28322b;
  --op-border-soft: #1f2822;
  --op-input: #28322b;
  --op-ring: #55c78d;

  /* Semantic aliases for internal consistency */
  --op-bg: #0f1310;
  --op-bg-raised: #161d18;
  --op-bg-inset: #0b0f0c;
  --op-bg-hover: #1d2620;
  --op-text: #e8ece7;
  --op-text-dim: #8fa094;
  --op-accent: #55c78d;
  --op-accent-strong: #3aa673;
  --op-accent-ink: #0a2317;
  --op-accent-soft: rgba(85, 199, 141, 0.14);

  /* State colors */
  --state-success: #55c78d;
  --state-warning: #e2b93b;
  --state-error: #ef6a6a;
  --state-info: #6db3f2;

  /* Radius scale */
  --op-radius-small: 4px;
  --op-radius-medium: 8px;
  --op-radius-large: 12px;
  --op-radius-full: 9999px;

  /* Panda brand accents */
  --op-panda-head: #f7f3ea;
  --op-panda-blush: #f2a7b3;

  /* Depth */
  --op-shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 8px 28px rgba(0, 0, 0, 0.22);

  /* Typography */
  --op-font:
    -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
    'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --op-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* Density */
  --op-sidebar-width: 212px;
  --op-header-height: 56px;
  --op-mobile-nav-height: 56px;
}

:root[data-theme='light'] {
  color-scheme: light;
  --op-background: #f4f6f3;
  --op-foreground: #1d2721;
  --op-card: #ffffff;
  --op-card-foreground: #1d2721;
  --op-popover: #ffffff;
  --op-popover-foreground: #1d2721;
  --op-muted: #e7ebe6;
  --op-muted-foreground: #5f6d64;
  --op-primary: #1e7350;
  --op-primary-foreground: #ffffff;
  --op-border: #d8ded7;
  --op-border-soft: #e4e9e3;
  --op-input: #d8ded7;
  --op-ring: #26875c;
  --op-bg: #f4f6f3;
  --op-bg-raised: #ffffff;
  --op-bg-inset: #edf0ec;
  --op-bg-hover: #e7ebe6;
  --op-text: #1d2721;
  --op-text-dim: #5f6d64;
  --op-accent: #26875c;
  --op-accent-strong: #1e7350;
  --op-accent-ink: #ffffff;
  --op-accent-soft: rgba(38, 135, 92, 0.1);
  --op-panda-head: #ffffff;
  --op-shadow: 0 1px 2px rgba(20, 40, 30, 0.06), 0 8px 28px rgba(20, 40, 30, 0.08);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    color-scheme: light;
    --op-background: #f4f6f3;
    --op-foreground: #1d2721;
    --op-card: #ffffff;
    --op-card-foreground: #1d2721;
    --op-popover: #ffffff;
    --op-popover-foreground: #1d2721;
    --op-muted: #e7ebe6;
    --op-muted-foreground: #5f6d64;
    --op-primary: #1e7350;
    --op-primary-foreground: #ffffff;
    --op-border: #d8ded7;
    --op-border-soft: #e4e9e3;
    --op-input: #d8ded7;
    --op-ring: #26875c;
    --op-bg: #f4f6f3;
    --op-bg-raised: #ffffff;
    --op-bg-inset: #edf0ec;
    --op-bg-hover: #e7ebe6;
    --op-text: #1d2721;
    --op-text-dim: #5f6d64;
    --op-accent: #26875c;
    --op-accent-strong: #1e7350;
    --op-accent-ink: #ffffff;
    --op-accent-soft: rgba(38, 135, 92, 0.1);
    --op-panda-head: #ffffff;
    --op-shadow: 0 1px 2px rgba(20, 40, 30, 0.06), 0 8px 28px rgba(20, 40, 30, 0.08);
  }
}

<body class="min-h-screen antialiased pb-[var(--op-mobile-nav-height)] bg-background">
  <!-- Header -->
  <header class="sticky top-0 z-10 h-[var(--op-header-height)] flex items-center justify-between px-4 border-b border-border bg-background/95 backdrop-blur-sm">
    <div class="flex items-center gap-3">
      <div class="w-7 h-7 rounded-full bg-primary flex items-center justify-center text-primary-foreground font-bold text-sm">P</div>
      <h1 class="text-base font-semibold text-foreground">设置</h1>
    </div>
    <button type="button" class="p-2 rounded-[var(--op-radius-medium)] text-muted-foreground hover:bg-muted" aria-label="搜索">
      <i data-lucide="search" class="w-5 h-5"></i>
    </button>
  </header>

  <!-- Main content -->
  <main class="p-4 space-y-4">
    <!-- Model card -->
    <section class="op-card p-4" aria-labelledby="model-title">
      <div class="flex items-center gap-2 mb-4" id="model-title">
        <i data-lucide="brain-circuit" class="w-5 h-5 text-accent"></i>
        <h2 class="text-base font-medium text-foreground">模型</h2>
      </div>
      <div class="space-y-4">
        <div>
          <label class="op-label">模型端点</label>
          <input type="url" class="op-input" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
        </div>
        <div>
          <label class="op-label">API 密钥</label>
          <input type="password" class="op-input" placeholder="sk-••••••••••••••••••••••••">
        </div>
        <div>
          <label class="op-label">模型选择</label>
          <select class="op-input">
            <option>gpt-4o</option>
            <option>gpt-4o-mini</option>
            <option>claude-3-5-sonnet</option>
            <option>deepseek-chat</option>
            <option>自定义模型</option>
          </select>
        </div>
        <div class="flex gap-3 pt-1">
          <button type="button" class="op-btn op-btn-secondary"><i data-lucide="flask-conical" class="w-4 h-4"></i>测试</button>
          <button type="button" class="op-btn op-btn-primary"><i data-lucide="save" class="w-4 h-4"></i>保存</button>
        </div>
      </div>
    </section>

    <!-- Network card -->
    <section class="op-card p-4" aria-labelledby="network-title">
      <div class="flex items-center gap-2 mb-4" id="network-title">
        <i data-lucide="globe" class="w-5 h-5 text-accent"></i>
        <h2 class="text-base font-medium text-foreground">网络</h2>
      </div>
      <div class="space-y-4">
        <div>
          <label class="op-label">节点名称</label>
          <input type="text" class="op-input" value="panda-core">
        </div>
        <div>
          <label class="op-label">面板令牌</label>
          <input type="password" class="op-input" placeholder="••••••••••••••••">
        </div>
        <div>
          <label class="op-label">MCP 启动命令</label>
          <input type="text" class="op-input" placeholder="npx -y @openpanda/mcp-server" value="npx -y @openpanda/mcp-server">
        </div>
      </div>
    </section>

    <!-- Push card -->
    <section class="op-card p-4" aria-labelledby="push-title">
      <div class="flex items-center gap-2 mb-4" id="push-title">
        <i data-lucide="bell" class="w-5 h-5 text-accent"></i>
        <h2 class="text-base font-medium text-foreground">推送</h2>
      </div>
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-sm font-medium text-foreground">启用跨设备推送</div>
            <div class="text-xs text-muted-foreground">在手机或其他节点上接收提醒</div>
          </div>
          <button type="button" id="push-toggle" class="relative w-11 h-6 rounded-full bg-primary transition-colors" aria-pressed="true">
            <span class="absolute left-1 top-1 w-4 h-4 rounded-full bg-primary-foreground transition-transform translate-x-5"></span>
          </button>
        </div>
        <div>
          <label class="op-label">推送服务地址</label>
          <input type="url" class="op-input" placeholder="https://push.openpanda.local">
        </div>
      </div>
    </section>

    <!-- Appearance card -->
    <section class="op-card p-4" aria-labelledby="appearance-title">
      <div class="flex items-center gap-2 mb-4" id="appearance-title">
        <i data-lucide="palette" class="w-5 h-5 text-accent"></i>
        <h2 class="text-base font-medium text-foreground">外观</h2>
      </div>
      <div class="space-y-4">
        <div>
          <label class="op-label">主题</label>
          <div class="flex rounded-[var(--op-radius-medium)] border border-input p-1 bg-bg-inset" role="group" aria-label="主题切换">
            <button type="button" data-theme-value="light" class="theme-btn flex-1 px-3 py-2 text-sm rounded-[var(--op-radius-small)] text-muted-foreground">浅色</button>
            <button type="button" data-theme-value="dark" class="theme-btn flex-1 px-3 py-2 text-sm rounded-[var(--op-radius-small)] bg-primary text-primary-foreground">深色</button>
            <button type="button" data-theme-value="auto" class="theme-btn flex-1 px-3 py-2 text-sm rounded-[var(--op-radius-small)] text-muted-foreground">自动</button>
          </div>
        </div>
        <div>
          <label class="op-label">语言</label>
          <select class="op-input">
            <option value="zh-CN">简体中文</option>
            <option value="en-US">English</option>
            <option value="ja-JP">日本語</option>
          </select>
        </div>
      </div>
    </section>

    <!-- About card -->
    <section class="op-card p-4" aria-labelledby="about-title">
      <div class="flex items-center gap-2 mb-4" id="about-title">
        <i data-lucide="info" class="w-5 h-5 text-accent"></i>
        <h2 class="text-base font-medium text-foreground">关于</h2>
      </div>
      <div class="space-y-3 text-sm">
        <div class="flex justify-between"><span class="text-muted-foreground">版本</span><span class="text-foreground font-mono">0.4.2</span></div>
        <div class="flex justify-between"><span class="text-muted-foreground">口号</span><span class="text-foreground">小事自动，大事分派</span></div>
        <div class="flex justify-between"><span class="text-muted-foreground">开源协议</span><span class="text-foreground">MIT</span></div>
      </div>
    </section>

    <div class="h-4"></div>
  </main>

  <!-- Bottom tab nav -->
  <nav class="fixed bottom-0 left-0 right-0 h-[var(--op-mobile-nav-height)] border-t border-border bg-card flex items-stretch z-20">
    <a href="chat.html" class="mobile-nav-item" data-dom-id="nav-chat">
      <i data-lucide="message-square" class="w-5 h-5"></i>
      <span>聊天</span>
    </a>
    <a href="queue.html" class="mobile-nav-item" data-dom-id="nav-queue">
      <i data-lucide="list-checks" class="w-5 h-5"></i>
      <span>队列</span>
    </a>
    <a href="settings-mobile.html" class="mobile-nav-item active">
      <i data-lucide="settings" class="w-5 h-5"></i>
      <span>设置</span>
    </a>
  </nav>

  <script>
    lucide.createIcons();

    const themeBtns = document.querySelectorAll('.theme-btn');
    function setThemeButtons(value) {
      themeBtns.forEach(btn => {
        const active = btn.dataset.themeValue === value;
        btn.classList.toggle('bg-primary', active);
        btn.classList.toggle('text-primary-foreground', active);
        btn.classList.toggle('text-muted-foreground', !active);
      });
    }
    themeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const value = btn.dataset.themeValue;
        if (value === 'auto') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', value);
        }
        setThemeButtons(value);
      });
    });

    const pushToggle = document.getElementById('push-toggle');
    pushToggle.addEventListener('click', () => {
      const pressed = pushToggle.getAttribute('aria-pressed') === 'true';
      pushToggle.setAttribute('aria-pressed', String(!pressed));
      pushToggle.classList.toggle('bg-primary', !pressed);
      pushToggle.classList.toggle('bg-muted', pressed);
      pushToggle.querySelector('span').classList.toggle('translate-x-5', !pressed);
      pushToggle.querySelector('span').classList.toggle('translate-x-0', pressed);
    });
  </script>

    <style>
    .bg-background { background-color: var(--op-background); }
    .bg-card { background-color: var(--op-card); }
    .bg-muted { background-color: var(--op-muted); }
    .bg-primary { background-color: var(--op-primary); }
    .text-foreground { color: var(--op-foreground); }
    .text-muted-foreground { color: var(--op-muted-foreground); }
    .text-primary { color: var(--op-primary); }
    .text-accent { color: var(--op-accent); }
    .border-border { border-color: var(--op-border); }
    .border-input { border-color: var(--op-input); }
    .ring-ring { --tw-ring-color: var(--op-ring); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    [data-icon] { display: inline-flex; align-items: center; justify-content: center; }
    .op-input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      background: var(--op-bg-inset);
      color: var(--op-text);
      border: 1px solid var(--op-input);
      border-radius: var(--op-radius-medium);
      outline: none;
      font-size: 1rem;
    }
    .op-input:focus { border-color: var(--op-ring); box-shadow: 0 0 0 2px var(--op-accent-soft); }
    .op-label { display: block; font-size: 0.8125rem; color: var(--op-text-dim); margin-bottom: 0.375rem; }
    .op-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem;
      padding: 0.625rem 1rem; border-radius: var(--op-radius-medium); font-weight: 500; cursor: pointer;
      transition: opacity .15s ease; flex: 1;
    }
    .op-btn-primary { background: var(--op-primary); color: var(--op-primary-foreground); border: none; }
    .op-btn-secondary { background: var(--op-bg-hover); color: var(--op-text); border: 1px solid var(--op-border); }
    .op-btn:hover { opacity: .9; }
    .op-card {
      background: var(--op-card);
      border: 1px solid var(--op-border);
      border-radius: var(--op-radius-large);
      box-shadow: var(--op-shadow);
    }
    .mobile-nav-item {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem;
      padding: 0.375rem 0;
      color: var(--op-text-dim);
      text-decoration: none;
      font-size: 0.6875rem;
    }
    .mobile-nav-item.active { color: var(--op-accent); }
  </style>
</body>
