# 桌面工作节点能力卡示例（开发机 / 普通 PC）
# 复制并按实际设备改名后使用：
#   cp config/capabilities.example-desktop.yaml config/capabilities.my-desktop.yaml
# 或直接让 panda 扫描硬件生成草稿：
#   panda detect > capabilities.yaml
#
# 字段与 internal/ledger/capability.go 的 Card 结构一一对应：
#   device         节点名（显示用）
#   resource_class Micro | Standard | Full（调度打分用）
#   node_kind      physical | vm（同机 singleton 锁按 kind 区分）
#   native         本机可确定性执行的白名单命令（tier: 1=可逆 2=不可逆需授权）
#   agents         已安装的 agent CLI（adapter 指向 adapters/<name>.py）
#                  tier 缺省为 2（不可逆）：未授权会被拒绝并进待审批，批准后带
#                  授权重跑；--authorize 提交则执行后直接完成（一次同意即可）；
#                  只读型 agent 可声明 tier: 1 免授权直接完成
#   capacity       本节点并行任务数与资源上限
#   resource_profile 声明的硬件（cpu / ram_gb / gpu_vram_gb / duration_hint）。
#                  capacity 是"现在还能接几个"，这里是"跑得动什么"：路由把它当硬判据，
#                  声明 gpu_vram_gb: 8 的任务不会落到 gpu_vram_gb: 0 的节点上。
#                  整段省略等于"未声明"，路由放行 —— 想被排除必须开口。

device: "example-desktop"
resource_class: "Standard"
node_kind: "physical"
chip: "Apple M1 / x86_64"

native:
  - id: "sys:info"
    command: "uname"
    args: ["-a"]
    tier: 1
    description: "system info"
  - id: "disk:usage"
    command: "df"
    args: ["-h", "."]
    tier: 1
    description: "disk usage of the work directory"

agents:
  claude_code:
    adapter: "claude_code.py"
    install_check: "claude --version"
    capabilities: ["coding", "shell", "file_edit", "build"]
    best_at: ["multi_file_edits", "code_search", "running_tests"]
    not_for: ["hardware_io", "realtime_control"]
    cost_tier: "high"
    tier: 2
  codex:
    adapter: "codex.py"
    install_check: "codex --version"
    capabilities: ["coding", "shell", "file_edit"]
    best_at: ["code_review", "refactoring"]
    not_for: ["hardware_io"]
    cost_tier: "medium"
    tier: 2

capacity:
  cpu_cores: 8
  ram_gb: 16
  max_concurrent_tasks: 3

# 声明的硬件上限，路由的硬判据：任务声明 gpu_vram_gb: 8 时，
# 只有这里 >= 8 的节点才会被选中。整段省略等于"未声明"，路由放行不排除。
resource_profile:
  cpu: 8
  ram_gb: 16
  gpu_vram_gb: 8
  duration_hint: long
