<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>PANDA 控制台</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 1rem; max-width: 960px; margin-inline: auto; color: #111827; }
    @media (prefers-color-scheme: dark) { body { background: #111827; color: #e5e7eb; } }
    header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; margin: 0; }
    .filters { display: flex; gap: 0.5rem; }
    select, input { padding: 0.35rem 0.5rem; border-radius: 6px; border: 1px solid #9ca3af; background: transparent; color: inherit; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid #d1d5db; }
    @media (prefers-color-scheme: dark) { th, td { border-bottom-color: #374151; } }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f3f4f6; }
    @media (prefers-color-scheme: dark) { tbody tr:hover { background: #1f2937; } }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; background: #e5e7eb; }
    .badge.review { background: #fde68a; color: #78350f; }
    .badge.done { background: #bbf7d0; color: #14532d; }
    .badge.failed, .badge.cancelled, .badge.expired { background: #fecaca; color: #7f1d1d; }
    .badge.running, .badge.dispatched, .badge.queued { background: #bfdbfe; color: #1e3a8a; }
    #detail { margin-top: 1.5rem; padding: 1rem; border: 1px solid #d1d5db; border-radius: 8px; }
    #detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.4rem 1rem; }
    #detail dt { font-weight: 600; }
    #detail dd { margin: 0; }
    #detail-actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
    button { padding: 0.4rem 0.9rem; border-radius: 6px; border: 1px solid #9ca3af; background: transparent; color: inherit; cursor: pointer; }
    button.approve { background: #16a34a; border-color: #16a34a; color: #fff; }
    button.reject { background: #dc2626; border-color: #dc2626; color: #fff; }
    #events { margin-top: 1rem; }
    #events li { font-family: ui-monospace, monospace; font-size: 0.8rem; padding: 0.2rem 0; }
    .empty { color: #6b7280; padding: 1rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>PANDA 控制台</h1>
    <div class="filters">
      <select id="state">
        <option value="">全部状态</option>
        <option>submitted</option><option>queued</option><option>dispatched</option>
        <option>waiting_context</option><option>running</option><option>review</option>
        <option>done</option><option>failed</option><option>cancelled</option><option>expired</option>
      </select>
      <input id="project" placeholder="项目名筛选" autocomplete="off">
    </div>
  </header>

  <main>
    <section id="queue">
      <table>
        <thead><tr><th>标题</th><th>状态</th><th>项目</th><th>更新时间</th></tr></thead>
        <tbody><tr><td colspan="4" class="empty">加载中…</td></tr></tbody>
      </table>
    </section>

    <section id="detail" hidden>
      <h2 id="detail-title"></h2>
      <dl>
        <dt>状态</dt><dd><span id="detail-state" class="badge"></span></dd>
        <dt>项目</dt><dd id="detail-project"></dd>
        <dt>所有者</dt><dd id="detail-owner"></dd>
        <dt>意图</dt><dd id="detail-intent"></dd>
        <dt>结果</dt><dd id="detail-result"></dd>
      </dl>
      <div id="detail-actions"></div>
      <h3>事件</h3>
      <ul id="events"></ul>
    </section>
  </main>

  <script>
    const $ = (s) => document.querySelector(s);
    const stateNames = { submitted:'submitted', queued:'queued', dispatched:'dispatched',
      waiting_context:'waiting_context', running:'running', review:'review', done:'done',
      failed:'failed', cancelled:'cancelled', expired:'expired' };

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => (
        { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }

    function badge(state) {
      const cls = (state === 'review' || state === 'done' || ['failed','cancelled','expired'].includes(state))
        ? state : 'active';
      return `<span class="badge ${cls}">${esc(state)}</span>`;
    }

    async function loadQueue() {
      const params = new URLSearchParams();
      if ($('#state').value) params.set('state', $('#state').value);
      if ($('#project').value.trim()) params.set('project', $('#project').value.trim());
      const res = await fetch('/api/tasks?' + params.toString());
      const tasks = await res.json();
      const tbody = $('#queue tbody');
      tbody.innerHTML = '';
      if (!tasks.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">无任务</td></tr>';
        return;
      }
      for (const t of tasks) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${esc(t.title)}</td><td>${badge(t.state)}</td><td>${esc(t.project || '-')}</td><td>${esc(t.updated_at || '')}</td>`;
        tr.addEventListener('click', () => loadDetail(t.id));
        tbody.appendChild(tr);
      }
    }

    async function loadDetail(id) {
      const res = await fetch('/api/tasks/' + encodeURIComponent(id));
      if (!res.ok) return;
      const t = await res.json();
      $('#detail').hidden = false;
      $('#detail-title').textContent = t.title || t.id;
      $('#detail-state').textContent = t.state;
      $('#detail-state').className = 'badge ' + (['review','done','failed','cancelled','expired'].includes(t.state) ? t.state : 'active');
      $('#detail-project').textContent = t.project || '-';
      $('#detail-owner').textContent = t.owner || '-';
      $('#detail-intent').textContent = t.intent || '-';
      $('#detail-result').textContent = t.result || '-';

      const actions = $('#detail-actions');
      actions.innerHTML = '';
      if (t.state === 'review') {
        const ok = document.createElement('button');
        ok.className = 'approve'; ok.textContent = '批准';
        ok.addEventListener('click', async () => {
          await fetch(`/api/tasks/${encodeURIComponent(id)}/approve`, { method: 'POST' });
          loadDetail(id); loadQueue();
        });
        const no = document.createElement('button');
        no.className = 'reject'; no.textContent = '拒绝';
        no.addEventListener('click', async () => {
          await fetch(`/api/tasks/${encodeURIComponent(id)}/reject?reason=rejected-by-operator`, { method: 'POST' });
          loadDetail(id); loadQueue();
        });
        actions.append(ok, no);
      }

      const ul = $('#events');
      ul.innerHTML = '';
      if (t.events && t.events.length) {
        for (const e of t.events) {
          const li = document.createElement('li');
          const when = e.ts ? new Date(e.ts * 1000).toLocaleString() : '';
          li.textContent = `${when}  ${e.type}  ${e.data || ''}`;
          ul.appendChild(li);
        }
      }
    }

    $('#state').addEventListener('change', loadQueue);
    $('#project').addEventListener('input', () => { clearTimeout(loadQueue._t); loadQueue._t = setTimeout(loadQueue, 250); });

    loadQueue();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
</body>
</html>
