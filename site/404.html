<!doctype html>

<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title data-i18n="title">404 — 这条航线没有节点 · OpenPanda</title>
<style>
  /* Self-contained on purpose: GitHub Pages serves this file for any missing
     path, so relative asset URLs would resolve against that path and 404 too.
     The two background URLs cover root-relative hosting and local preview. */
  :root {
    --paper: #faf9f5;
    --jade: #6fc7a1;
    --night: #05060a;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --serif: 'Newsreader', 'Songti SC', 'STSong', Georgia, serif;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 32px;
    background: var(--night);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    /* A short phone can be taller than the sheet; let it scroll instead of
       clipping the links and the footer (the sky itself is fixed). */
    overflow-x: hidden;
  }
  .sky {
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(5,6,10,.72) 0%, rgba(5,6,10,.88) 60%, #05060a 100%),
      url('/OpenPanda/textures/hero-still.jpg') center / cover no-repeat,
      url('textures/hero-still.jpg') center / cover no-repeat,
      radial-gradient(120% 80% at 70% 10%, rgba(111,199,161,.12), transparent 60%),
      #05060a;
    filter: saturate(.9);
  }
  .sky::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(60% 50% at 50% 50%, transparent, rgba(5,6,10,.55) 70%);
  }
  main { position: relative; max-width: 640px; text-align: center; }
  .mark { width: 52px; height: 52px; margin: 0 auto 28px; border-radius: 15px; background: #0c7a55; display: grid; place-items: center; box-shadow: 0 14px 40px -16px rgba(12, 122, 85, .8); }
  .code {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(84px, 18vw, 148px);
    font-weight: 300;
    line-height: .9;
    letter-spacing: -.05em;
    color: rgba(250,249,245,.92);
  }
  .kicker {
    margin: 18px 0 0;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--jade);
  }
  h1 { margin: 26px 0 14px; font-size: clamp(20px, 3.2vw, 26px); font-weight: 600; letter-spacing: -.02em; }
  p.lede {
    margin: 0 auto;
    max-width: 460px;
    font-family: var(--serif);
    font-size: 16px;
    line-height: 1.75;
    color: rgba(250,249,245,.56);
  }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 36px; }
  .links a {
    padding: 11px 20px;
    border: 1px solid rgba(250,249,245,.22);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(250,249,245,.8);
    text-decoration: none;
    transition: border-color .2s, color .2s, background .2s;
  }
  .links a:hover { border-color: var(--jade); color: #fff; background: rgba(12,122,85,.24); }
  .links a.primary { border-color: rgba(111,199,161,.6); color: var(--jade); }
  .links button {
    padding: 11px 20px;
    background: transparent;
    border: 1px solid rgba(250,249,245,.22);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(250,249,245,.8);
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  .links button:hover { border-color: var(--jade); color: #fff; background: rgba(12,122,85,.24); }
  footer {
    position: relative;
    margin-top: 56px;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(250,249,245,.28);
  }
</style>
</head>
<body>
  <div class="sky" aria-hidden="true"></div>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="32" height="32" viewBox="0 0 40 40" aria-hidden="true"><defs><mask id="pm404"><rect width="40" height="40" fill="#000"/><circle cx="20" cy="21.9" r="11.6" fill="#fff"/><circle cx="12.1" cy="10.7" r="4.7" fill="#fff"/><circle cx="27.9" cy="10.7" r="4.7" fill="#fff"/><ellipse cx="15.2" cy="20.1" rx="2.45" ry="3.05" transform="rotate(-16 15.2 20.1)" fill="#000"/><ellipse cx="24.8" cy="20.1" rx="2.45" ry="3.05" transform="rotate(16 24.8 20.1)" fill="#000"/><ellipse cx="20" cy="26.4" rx="1.55" ry="1.15" fill="#000"/></mask></defs><rect width="40" height="40" fill="#eafff6" mask="url(#pm404)"/></svg>
    </div>

    <p class="code">404</p>
    <p class="kicker">No node at this coordinate</p>
    <h1 data-i18n="h1">这条航线没有节点。</h1>
    <p class="lede" data-i18n="lede">页面可能已经改名、被合并进别的章节，或者这一步本来就在你的计划之外。回到主场，或者去仓库里找找。</p>

    <div class="links">
      <a class="primary" href="/OpenPanda/" data-i18n="home">返回首页</a>
      <a href="https://github.com/Xustalis/OpenPanda">GitHub</a>
      <a href="https://github.com/Xustalis/OpenPanda/blob/main/docs/status.md" data-i18n="status">项目现状</a>
      <button type="button" id="lang-toggle" aria-label="切换语言 / Switch language">EN</button>
    </div>

    <footer>OpenPanda · Local-first orchestration kernel</footer>
  </main>

<script>
// Same contract as the main page: Chinese is the markup, English is a table,
// and the choice persists under the site-wide key. Self-contained on purpose —
// this file is served for any missing path, so it loads no other asset.
(function () {
  var KEY = 'openpanda.site.lang'
  var EN = {
    title: '404 — no node at this coordinate · OpenPanda',
    h1: 'No node at this coordinate.',
    lede: 'The page may have been renamed, merged into another section, or this step was never in your plan. Head back, or go digging in the repository.',
    home: 'Back to home',
    status: 'Project status',
  }
  var root = document.documentElement
  var nodes = [].slice.call(document.querySelectorAll('[data-i18n]'))
  var zh = new Map()
  nodes.forEach(function (el) { zh.set(el, el.innerHTML) })
  var btn = document.getElementById('lang-toggle')

  function read() {
    var q = new URLSearchParams(location.search).get('lang')
    if (q === 'en' || q === 'zh') return q
    try { var s = localStorage.getItem(KEY); if (s === 'en' || s === 'zh') return s } catch (e) {}
    return /^zh/i.test(navigator.language || '') ? 'zh' : 'en'
  }

  function apply(lang) {
    nodes.forEach(function (el) {
      var key = el.getAttribute('data-i18n')
      var value = lang === 'en' ? EN[key] : zh.get(el)
      if (value == null) return
      if (el.tagName === 'TITLE') el.textContent = value
      else el.innerHTML = value
    })
    root.setAttribute('data-lang', lang)
    root.setAttribute('lang', lang === 'zh' ? 'zh-CN' : 'en')
    btn.textContent = lang === 'zh' ? 'EN' : '中文'
    btn.setAttribute('aria-label', lang === 'zh' ? 'Switch to English' : '切换到中文')
  }

  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-lang') === 'zh' ? 'en' : 'zh'
    try { localStorage.setItem(KEY, next) } catch (e) {}
    apply(next)
  })

  apply(read())
})()
</script>
</body>
</html>
